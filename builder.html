y the victim.","source":"Corebook, page 250","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.haruspex":{"canonical":"","effect":"Use the recent dead to reroll dice before night's end.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Oblivion ●","duration":"One night","pool":"Resolve + Auspex","opposed":"N/A","notes":"Requires a mortal body who died within the scene.","source":"Vampire: The Masquerade Tattered Façade, page 91","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.read-the-room":{"canonical":"","effect":"Mentally pose a question and receive the general sentiment of a crowd.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Instantaneous or one scene on crit.","pool":"Intelligence + Auspex","opposed":"N/A","notes":"ST discretion on if a question is too complex. Difficult lessens with more people present.","source":"Vampire: The Masquerade Courts of the Damned, page 214","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.reveal-the-invisible-leash":{"canonical":"","effect":"With physical contact, detect who a target considers themselves politically subordinate to.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"As long as vampire tocuhes target.","pool":"Intelligence + Auspex","opposed":"Composure + Resolve","notes":"Most immediate superiors are detected first, margin may give more superiors.","source":"Vampire: The Masquerade Courts of the Damned, page 214","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.touch":{"canonical":"","effect":"Gathering emotional residue from an object or location","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Intelligence + Auspex","opposed":"N/A","notes":"What information they glean works from the most recent backward.","source":"Corebook, page 250","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.heart-laid-bare":{"canonical":"","effect":"Know target's deepest fear or desire","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"Intelligence + Auspex","opposed":"Composure + Subterfuge","notes":"N/A","source":"Vampire: The Masquerade Tattered Façade, page 91-92","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.clairvoyance":{"canonical":"","effect":"Information gathering from surroundings","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Few minutes up to one night","pool":"Intelligence + Auspex","opposed":"N/A","notes":"This power can be used to monitor events in progress.","source":"Corebook, page 251","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.possession":{"canonical":"","effect":"Possess a mortal body","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"Dominate ●●●","duration":"Until ended","pool":"Resolve + Auspex","opposed":"Resolve + Intelligence","notes":"This power does not give the ability to read the target's mind, use their skills or impersonate them.","source":"Corebook, page 251","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.telepathy":{"canonical":"","effect":"Read minds and project thoughts","cost":"One Rouse (one Willpower on non-consenting vampires)","prerequisite":"None","amalgam":"No","duration":"One minute per rouse or full scene on consenting subject","pool":"Resolve + Auspex","opposed":"Wits + Subterfuge","notes":"The user doesn't need to roll to project their thoughts onto others.","source":"Corebook, page 252","url":"https://vtm.paradoxwikis.com/Auspex"},"auspex.unburdening-the-bestial-soul":{"canonical":"","effect":"Stain removal or protection from Stains","cost":"Two Rouse checks, 1 Stain","prerequisite":"Panacea","amalgam":"Dominate ●●●","duration":"One session","pool":"Composure + Auspex","opposed":"N/A","notes":"This power only works on vampires with a lower Humanity rating.","source":"Companion, page 24 Players Guide, page 71","url":"https://vtm.paradoxwikis.com/Auspex"},"fortitude.fluent-endurance":{"canonical":"","effect":"Reroll the Blood Surge rouse check on a Stamina or Fortitude test.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Once","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Gehenna War, page 46","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.resilience":{"canonical":"","effect":"Add their Fortitude rating to the health track.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Corebook, page 258","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.mind":{"canonical":"","effect":"Add Fortitude rating to rolls to resist methods to sway the character's mind against their will including supernatural.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Corebook, page 258","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.earths-perseverance":{"canonical":"","effect":"Become impossible to move from that spot","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene or until let go by user","pool":"N/A","opposed":"N/A","notes":"While they cannot be moved, they can still be harmed and so can the floor beneath them.","source":"Players Guide, page 74","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.enduring-beasts":{"canonical":"","effect":"Share the vampire's toughness with animals.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Animalism ●","duration":"One scene","pool":"Stamina + Animalism","opposed":"N/A","notes":"If used on their Famulus, it is free and automatic without a roll required.","source":"Corebook, page 258","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.invigorating-vitae":{"canonical":"","effect":"Heal mortals faster with the Blood.","cost":"None other than the Rouse Checks to give Blood","prerequisite":"None","amalgam":"Auspex ●","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"The risk of ghouling or blood bonding remains present.","source":"Players Guide, page 75","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.obdurate":{"canonical":"","effect":"Maintain footing when hit with a massive force.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Potence ●●","duration":"One scene","pool":"Wits + Survival","opposed":"N/A","notes":"Any superficial damage from falling or being hit is reduced by the Fortitude score, before being halved.","source":"Winter's Teeth #3","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.toughness":{"canonical":"","effect":"Subtract the Fortitude rating from all superficial damage taken before halving, it cannot be rounded down below one.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"This occurs before halving the damage but cannot reduce it below one.","source":"Corebook, page 258","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.self-assurance":{"canonical":"","effect":"Take superficial Willpower damage reduced by their level of Fortitude when in Social Combat.","cost":"One Rouse Check","prerequisite":"Unswayable Mind","amalgam":"No","duration":"One scene, or until depleted, or until end of social combat","pool":"N/A","opposed":"N/A","notes":"If the damage is Aggravated Willpower damage, they can use the remaining benefit of the power to negate that damage, but it cannot be renewed in the same scene after this.","source":"Live from the Succubus Club, page 27-28","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.bane":{"canonical":"","effect":"Convert Aggravated Damage to Superficial Damage.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene or until expired","pool":"Wits + Survival","opposed":"N/A","notes":"They may not heal the superficial damage for the rest of the scene.","source":"Corebook, page 259","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.facade":{"canonical":"","effect":"Increasing the Difficulty of mental powers to read or pierce the mind by half of the Fortitude Rating.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"If the rules allow them to resist, they add their Fortitude rating to their pool instead.","source":"Corebook, page 259","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.seal-the-beasts-maw":{"canonical":"","effect":"A vampire can ignore the effects of hunger, but reduce their dice pools as a result.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"If a dice pool reduces to 0, a Fury Frenzy test is made.","source":"Forbidden Religions, page 44","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.valeren":{"canonical":"","effect":"Mend an injured vampire.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●","duration":"N/A","pool":"Intelligence + Fortitude","opposed":"N/A","notes":"A subject can be affected by the power only once a night.","source":"Companion, page 25 Players Guide, page 75","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.calloused-soul":{"canonical":"","effect":"Pre-emptively gain stains to prevent/reduce further stain gains.","cost":"Two stains","prerequisite":"None","amalgam":"None","duration":"One night","pool":"N/A","opposed":"N/A","notes":"A vampire actually gains three stains doing this, but one can be mitigated by a Conviction.","source":"Tattered Facade, page 97-98","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.gift":{"canonical":"","effect":"Turn their vitae into a Fortitude boost for others.","cost":"One Rouse Check + Drinkers","prerequisite":"None","amalgam":"No","duration":"One night","pool":"N/A","opposed":"N/A","notes":"Each drinker must take one Rouse Check's worth.","source":"Corebook, page 259","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.gorgons-scales":{"canonical":"","effect":"Resonances give the Kindred different bonuses.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene or until the Resonance is lost","pool":"N/A","opposed":"N/A","notes":"Choleric frees vampires from being staked, Melancholy reduces fire damage, Phlegmatic strengthens against Auspex and, Sanguine reduces damage from sunlight.","source":"Players Guide, page 75","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.shatter":{"canonical":"","effect":"The opponent takes the damage which Toughness subtracts.","cost":"One Rouse Check","prerequisite":"Toughness","amalgam":"No","duration":"One scene or until hit","pool":"N/A","opposed":"N/A","notes":"Weapons will break if their modifier is met in damage received.","source":"Cults of the Blood Gods, page 104","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.marble":{"canonical":"","effect":"Ignore the first source of physical damage each turn unless sunlight.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"A critical win on an attack bypasses this power.","source":"Corebook, page 259","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.prowess-from-pain":{"canonical":"","effect":"No longer suffers penalty from Health damage and can increase one Attribute per level of damage on their tracker.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"The Attributes may not exceed their Blood Surge value + 6.","source":"Corebook, page 260","url":"https://vtm.paradoxwikis.com/Fortitude"},"fortitude.meat-shields":{"canonical":"","effect":"Increase Fortitude by a number equal to half the weak mortals present. (Rounded down)","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene, or when the caster leaves targets","pool":"N/A","opposed":"N/A","notes":"Maximum of 5 dots.","source":"Tattered Facade, page 98","url":"https://vtm.paradoxwikis.com/Fortitude"},"potence.fluent-strength":{"canonical":"","effect":"Reroll Blood Surge rouse checks on Strength or Potence rolls.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Once","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Gehenna War, page 47","url":"https://vtm.paradoxwikis.com/Potence"},"potence.lethal":{"canonical":"","effect":"Unarmed attacks do Aggravated Health damage to mortals when used and ignore one level of armor per Potence rating of user.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Corebook, page 264","url":"https://vtm.paradoxwikis.com/Potence"},"potence.leap":{"canonical":"","effect":"Leap higher and further than usual.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"They can move as many meters as three times their Potence rating.","source":"Corebook, page 264","url":"https://vtm.paradoxwikis.com/Potence"},"potence.prowess":{"canonical":"","effect":"Add Potence rating to their unarmed damage and to feats of Strength, add half their Potence rating (Rounded up) to Melee damage.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Corebook, page 264","url":"https://vtm.paradoxwikis.com/Potence"},"potence.relentless-grasp":{"canonical":"","effect":"Gain supernatural grip strength.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"Does not benefit the initial grapple test.","source":"Players Guide, page 79","url":"https://vtm.paradoxwikis.com/Potence"},"potence.feast":{"canonical":"","effect":"Turn feeding into a violent and messy affair that only lasts seconds to Slake the user's Hunger.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One feeding","pool":"N/A","opposed":"N/A","notes":"Against vampires the number of feeding actions is halved (rounded down).","source":"Corebook, page 264","url":"https://vtm.paradoxwikis.com/Potence"},"potence.exuberance":{"canonical":"","effect":"Treat Potence rating as two levels higher when using Potence powers.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"This can take the relative discipline above the limit of 5. But when a critical or failure is rolled, take Aggravated Damage.","source":"Tattered Façade, page 103","url":"https://vtm.paradoxwikis.com/Potence"},"potence.rage":{"canonical":"","effect":"The user can add their Potence rating to rile or incite a person or crowd to violent actions.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Presence ●●●","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"Against vampires, the user will roll Manipulation + Potence vs Intelligence + Composure.","source":"Corebook, page 265","url":"https://vtm.paradoxwikis.com/Potence"},"potence.uncanny-grip":{"canonical":"","effect":"Strengthens their grip on most surfaces, allowing them to climb or hang unsupported.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"The use of this power leaves obvious traces from the damage caused.","source":"Corebook, page 265","url":"https://vtm.paradoxwikis.com/Potence"},"potence.wrecker":{"canonical":"","effect":"Double Potence rating when used for feats of strength","cost":"Free","prerequisite":"Prowess","amalgam":"No","duration":"Refer Prowess","pool":"N/A","opposed":"N/A","notes":"It cannot be used against living targets.","source":"Players Guide, page 79","url":"https://vtm.paradoxwikis.com/Potence"},"potence.gift":{"canonical":"","effect":"Turn their vitae into a Potence boost for others.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One night","pool":"N/A","opposed":"N/A","notes":"Each drinker must take one Rouse Check's worth.","source":"Corebook, page 265","url":"https://vtm.paradoxwikis.com/Potence"},"potence.crash-down":{"canonical":"","effect":"Deal damage to a small area when using Soaring Leap.","cost":"One Rouse Check","prerequisite":"Soaring Leap","amalgam":"No","duration":"N/A","pool":"Strength + Potence","opposed":"Dexterity + Athletics","notes":"If opponents total fail or take 3 or more levels of damage they are knocked down.","source":"Players Guide, page 79","url":"https://vtm.paradoxwikis.com/Potence"},"potence.earthshock":{"canonical":"","effect":"Create a shockwave to throw opponents prone.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One use","pool":"N/A","opposed":"N/A","notes":"This can only be used once per scene.","source":"Corebook, page 265","url":"https://vtm.paradoxwikis.com/Potence"},"potence.fist-of-caine":{"canonical":"","effect":"Inflict Aggravated Health damage to mortals and supernatural creatures alike.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Corebook, page 266","url":"https://vtm.paradoxwikis.com/Potence"},"potence.subtle-hammer":{"canonical":"","effect":"Project the vampire’s power in a specific body part.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"You cannot make another attack in the same move, but body parts that have limited movement receive a four-dice bonus or more.","source":"Players Guide, page 79","url":"https://vtm.paradoxwikis.com/Potence"},"celerity.grace":{"canonical":"","effect":"Automatically pass balance tests.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"Does not work on objects that cannot support their weight.","source":"Corebook, page 252","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.fluent-swiftness":{"canonical":"","effect":"Reroll Blood Surge on a Dexterity or Celerity test.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Once","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Gehenna War, page 46","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.reflexes":{"canonical":"","effect":"Faster reactions and minor actions.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"This power also prevents them from taking a penalty when they have no cover during a firefight.","source":"Corebook, page 253","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.fleetness":{"canonical":"","effect":"Add Celerity rating for non-combat Dexterity test or defending.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"This may be used once per turn when defending with associated pools.","source":"Corebook, page 253","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.rush-job":{"canonical":"","effect":"Perform a Skill-related task that would take a long time in mere seconds.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"This power does not speed up attacks or defenses.","source":"Players Guide, page 72","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.blink":{"canonical":"","effect":"Closes the distance as if teleporting.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Dexterity + Athletics","opposed":"N/A","notes":"The user moves in a straight line and may need to make checks against difficult terrain.","source":"Corebook, page 253","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.traversal":{"canonical":"","effect":"Move fast enough to move up vertical surfaces or liquid surfaces.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Dexterity + Athletics","opposed":"N/A","notes":"The Storyteller should inform the user beforehand if the target is too far away","source":"Corebook, page 253","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.weaving":{"canonical":"","effect":"Remove the penalty from dodging multiple ranged opponents.","cost":"One Rouse Check","prerequisite":"Rapid Reflexes","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"The user can all add their Celerity rating to ranged dodging attempts.","source":"Players Guide, page 72","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.a-thousand-cuts":{"canonical":"","effect":"Add Celerity to Brawl/Melee to automatically impair Mortals and make Kindred a Masquerade Violation","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One action","pool":"N/A","opposed":"N/A","notes":"Only usable with Claws or Edged Weaponry.","source":"Tattered Facade, page 96","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.blurred-momentum":{"canonical":"","effect":"Attacks against the user with fewer successes than their Celerity rating miss.","cost":"One Rouse Check per turn","prerequisite":"None","amalgam":"No","duration":"Until the user lets it lapse","pool":"N/A","opposed":"N/A","notes":"This works against powers that do not allow defense tests.","source":"Players Guide, page 72","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.gift":{"canonical":"","effect":"Turn their vitae into a Celerity boost for others","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One Night; for drinkers until the vampire's next feeding or Hunger 5","pool":"N/A","opposed":"N/A","notes":"Each drinker must take one Rouse Check's worth.","source":"Corebook, page 254","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.unerring-aim":{"canonical":"","effect":"The world slows down to a crawl","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●●","duration":"A single attack","pool":"N/A","opposed":"N/A","notes":"Those with Celerity 5 may nullify this power with a Rouse Check and defend.","source":"Corebook, page 254","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.unseen-strike":{"canonical":"","effect":"Disappear then reappear to surprise attack an enemy.","cost":"Two Rouse Checks","prerequisite":"Blink","amalgam":"Obfuscate ●●●●","duration":"One turn","pool":"Dexterity + Celerity","opposed":"Wits + Awareness","notes":"If the test is won, the attack is treated as a surprise attack. Else it follows the same attack/movement rules as Blink.","source":"Players Guide, page 73","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.faster-than-light":{"canonical":"","effect":"While using Blink, make an additional Rouse Check to pass through areas of sunlight or fire without damage or their effect.","cost":"One Rouse Check","prerequisite":"Blink","amalgam":"No","duration":"One Action","pool":"N/A","opposed":"N/A","notes":"This does not negate other impacts from daylight or fire, such as Frenzy Checks, awakening rolls, or dice pools.","source":"Live from the Succubus Club, page 27","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.lightning":{"canonical":"","effect":"Attack with lightning speed","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"A single attack","pool":"N/A","opposed":"N/A","notes":"Those with Celerity 5 may nullify this power with a Rouse Check and defend.","source":"Corebook, page 254","url":"https://vtm.paradoxwikis.com/Celerity"},"celerity.split-second":{"canonical":"","effect":"Alter the events given by Storyteller in a current scene within reason","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One action, as determined by ST","pool":"N/A","opposed":"N/A","notes":"The action should be reasonable and accomplished within a few seconds in real-time.","source":"Corebook, page 254","url":"https://vtm.paradoxwikis.com/Celerity"},"presence.awe":{"canonical":"","effect":"Add Presence rating to any Skill roll involving Persuasion, Performance, or Charisma related rolls as per ST discretion.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene or until ended by the user","pool":"N/A","opposed":"N/A","notes":"Once the power wears off the victim reverts to their original opinions.","source":"Corebook, page 267","url":"https://vtm.paradoxwikis.com/Presence"},"presence.daunt":{"canonical":"","effect":"Add Presence rating to any intimidation rolls.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene or until ended by the user","pool":"N/A","opposed":"N/A","notes":"Awe and Daunt cannot be used at the same time.","source":"Corebook, page 267","url":"https://vtm.paradoxwikis.com/Presence"},"presence.eyes-of-the-serpent":{"canonical":"","effect":"Immobilize a victim by making eye contact.","cost":"Free","prerequisite":"None","amalgam":"Protean ●","duration":"Until eye contact is broken or the scene ends","pool":"Charisma + Presence","opposed":"Wits + Composure","notes":"A vampire victim can break this by spending Willpower any turn after the first.","source":"Anarch, page 185 Players Guide, page 80","url":"https://vtm.paradoxwikis.com/Presence"},"presence.fascination":{"canonical":"","effect":"Usable during feedings, the victim gains a bonus to Social attribute for one night.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Number of nights equal to the user's Presence rating","pool":"N/A","opposed":"N/A","notes":"A withdrawal follows where the victim takes a penalty equal to the original bonus when not actively working towards the next fix. It cannot be used on those under a Blood Bond. Unbondable cannot take this discipline power.","source":"Corebook, page 267 Companion page 62","url":"https://vtm.paradoxwikis.com/Presence"},"presence.melpominee":{"canonical":"","effect":"Use Presence without seeing the target, only having them within earshot.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"Charisma + Presence","opposed":"N/A","notes":"This works with Awe, Daunt, Dread Gaze, Entrance, and Majesty.","source":"Players Guide, page 80","url":"https://vtm.paradoxwikis.com/Presence"},"presence.predators-lure":{"canonical":"","effect":"Use Presence to instill intense curiosity in a target and compel them to approach the user.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene, or until target is within10 feet/3 meters","pool":"Charisma + Leadership","opposed":"Composure + Resolve","notes":"Automatically works on mortals. Target will not risk danger or immediately drop everything. Cannot be used in a fight.","source":"Courts of the Damned, page 215","url":"https://vtm.paradoxwikis.com/Presence"},"presence.clear-the-field":{"canonical":"","effect":"Clear a space in a calm and orderly manner.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Dominate ●●●","duration":"N/A","pool":"Composure + Presence","opposed":"Wits + Composure","notes":"They can exempt a number of people equal to their Composure.","source":"Fall of London, page 31","url":"https://vtm.paradoxwikis.com/Presence"},"presence.dread":{"canonical":"","effect":"Instill fear into a target to make them flee.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Charisma + Presence","opposed":"Composure + Resolve","notes":"A critical win against a vampire victim means the victim makes a terror Frenzy at difficulty 3.","source":"Corebook, page 267","url":"https://vtm.paradoxwikis.com/Presence"},"presence.entrancement":{"canonical":"","effect":"Influence someone into a star-struck or beguiled state of mind where they do their best to keep the user happy. Adding their Presence rating in dice to any social rolls against the victim.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One hour plus one per point of margin","pool":"Charisma + Presence","opposed":"Composure + Wits","notes":"If the request is harmful to the victim or their loved ones, or opposes their tenets the test must be made again or Entrancement fails.","source":"Corebook, page 268","url":"https://vtm.paradoxwikis.com/Presence"},"presence.passion-leech":{"canonical":"","effect":"Leech the passion from a mortal target, gaining the benefits of Humanity 10 temporarily.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●●","duration":"Until Sunset for the vampire, 3 nights for the victim.","pool":"Composure + Auspex","opposed":"N/A","notes":"The benefit can be gained only once per night.","source":"Tattered Façade, page 104","url":"https://vtm.paradoxwikis.com/Presence"},"presence.thrown-voice":{"canonical":"","effect":"Throw their voice from any point within sight and leave the voice there.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"A roll is only needed if being used in combination with Irresistible Voice, Melpominee or similar powers.","source":"Players Guide, page 80","url":"https://vtm.paradoxwikis.com/Presence"},"presence.true-loves-face":{"canonical":"","effect":"The victim will perceive the user as a mortal they have strong emotional ties with, be it hatred or love.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Obfuscate ●●●","duration":"One scene","pool":"Manipulation + Presence","opposed":"Composure + Wits","notes":"Can net stains for the victim if the perceived target is their touchstone.","source":"Cults of the Blood Gods, page 85","url":"https://vtm.paradoxwikis.com/Presence"},"presence.invigorating-display":{"canonical":"","effect":"After interacting with a crowd, a vampire can inhale the energy of the crowd to experience a unique Resonance.","cost":"One Rouse Check","prerequisite":"Awe","amalgam":"No","duration":"One scene","pool":"Composure + Presence","opposed":"N/A","notes":"The Resonance is usually intense, but can be also acute on a critical win as determined by the Storyteller.","source":"Live from the Succubus Club, page 28","url":"https://vtm.paradoxwikis.com/Presence"},"presence.inflame-desire":{"canonical":"","effect":"Boost a victim's current desire, seeking only to satisfy it","cost":"One Rouse Check","prerequisite":"None","amalgam":"Obfuscate ●","duration":"One scene","pool":"Manipulation + Presence","opposed":"Composure + Resolve","notes":"Inflicts the Need Compulsion on the victim","source":"Tattered Façade, page 104","url":"https://vtm.paradoxwikis.com/Presence"},"presence.irresistible-voice":{"canonical":"","effect":"The user's voice alone is enough to use Dominate on a target.","cost":"No additional cost","prerequisite":"None","amalgam":"Dominate ●","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"Does not work through technology.","source":"Corebook, page 268","url":"https://vtm.paradoxwikis.com/Presence"},"presence.magnum-opus":{"canonical":"","effect":"Infusing Presence into artwork.","cost":"One or more Rouse Checks","prerequisite":"None","amalgam":"Auspex ●●●","duration":"N/A","pool":"Charisma/Manipulation + Craft","opposed":"N/A","notes":"Audiences must roll Composure + Resolve to resist its effects.","source":"Winter's Teeth #3","url":"https://vtm.paradoxwikis.com/Presence"},"presence.suffuse-the-edifice":{"canonical":"","effect":"Extend Presence onto a building.","cost":"N/A","prerequisite":"None","amalgam":"No","duration":"As power transmitted","pool":"As power transmitted","opposed":"As power transmitted","notes":"If the vampire is present they become the focus instead of the building.","source":"Players Guide, page 80","url":"https://vtm.paradoxwikis.com/Presence"},"presence.summon":{"canonical":"","effect":"Call someone to them who has had certain Presence powers used on them or tasted the user's vitae.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One night","pool":"Manipulation + Presence","opposed":"Composure + Intelligence","notes":"The victim will not physically or financially harm themselves to reach the user.","source":"Corebook, page 268","url":"https://vtm.paradoxwikis.com/Presence"},"presence.wingman":{"canonical":"","effect":"Extend Presence onto another character to use.","cost":"One Rouse Check plus additional powers","prerequisite":"None","amalgam":"No","duration":"As power used.","pool":"N/A","opposed":"N/A","notes":"The same Presence power used by both does not double the bonus.","source":"Blood Stained Love, page 152","url":"https://vtm.paradoxwikis.com/Presence"},"presence.majesty":{"canonical":"","effect":"Everyone who looks at the user is dumbstruck unable to act in any way other than self-preservation.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Charisma + Presence","opposed":"Composure + Resolve","notes":"A win on the contested roll allows one turn plus one per margin of freedom.","source":"Corebook, page 268","url":"https://vtm.paradoxwikis.com/Presence"},"presence.star-magnetism":{"canonical":"","effect":"Allows the use of presence through live-feed technology, does not work on recorded content.","cost":"One additional Rouse Check","prerequisite":"None","amalgam":"No","duration":"As power used","pool":"N/A","opposed":"N/A","notes":"If using Entrancement the user must speak the targets name clearly.","source":"Corebook, page 269","url":"https://vtm.paradoxwikis.com/Presence"},"dominate.cloud":{"canonical":"","effect":"Make someone forget the current moment.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Indefinitely","pool":"Charisma + Dominate","opposed":"Wits + Resolve","notes":"No rolls are needed when the target is an unprepared mortal.","source":"Corebook, page 256","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.compel":{"canonical":"","effect":"Issue a single command.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"No more than one scene","pool":"Charisma + Dominate","opposed":"Intelligence + Resolve","notes":"No rolls are needed when the target is an unprepared mortal. However, mortals who have been Dominated in this scene already or this goes against their nature may roll to resist.","source":"Corebook, page 256","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.slavish-devotion":{"canonical":"","effect":"Those already underneath Dominate find it easier to resist other kindred's Dominate.","cost":"Free","prerequisite":"None","amalgam":"Fortitude ●","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"Attempts by a third party take a dice penalty equal to the other vampire’s Fortitude rating.","source":"Cults of the Blood Gods, page 104 Players Guide, page 73","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.mesmerize":{"canonical":"","effect":"Issue complex commands.","cost":"One Rouse Check","prerequisite":"None","amalgam":"None","duration":"Until command is carried out or the scene ends","pool":"Manipulation + Dominate","opposed":"Intelligence + Resolve","notes":"No rolls are needed when the target is an unprepared mortal. However, if this goes against their nature they may roll to resist.","source":"Corebook, page 256","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.discord":{"canonical":"","effect":"Drive others insane.","cost":"One Rouse Check per target per Scene","prerequisite":"None","amalgam":"Obfuscate ●●","duration":"One scene","pool":"Manipulation + Dominate","opposed":"Composure + Intelligence","notes":"To use this power, the user must have had a conversation with them.","source":"Corebook, page 256","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.domitors-favor":{"canonical":"","effect":"Make defiance while under a Blood Bond more difficult.","cost":"One Rouse Check","prerequisite":"None","amalgam":"None","duration":"One month","pool":"N/A","opposed":"N/A","notes":"Total fail on defiance rolls means the bond does not weaken that month.","source":"Companion, page 25 Players Guide, page 74","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.the-stolen-voice":{"canonical":"","effect":"Remove a target's ability to express. Unable to speak, write or gesture.","cost":"One Rouse Check","prerequisite":"None","amalgam":"None","duration":"One scene","pool":"Composure + Dominate","opposed":"Resolve + Performance","notes":"No need to test to activate against mortals.","source":"Tattered Facade, page 96-97","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.forget":{"canonical":"","effect":"Rewrite someone's memory.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Indefinitely","pool":"Manipulation + Dominate","opposed":"Intelligence + Resolve","notes":"Each point of margin on the test allows one additional memory to be altered.","source":"Corebook, page 257","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.submerged-directive":{"canonical":"","effect":"Implant Dominate orders as suggestions for victims.","cost":"Free","prerequisite":"Mesmerize","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"These orders never expire until completed and targets can only have one at a time.","source":"Corebook, page 257","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.chain-of-command":{"canonical":"","effect":"Deliver a Mesmerize command, then invoke this power to allow the target to follow more complex commands with awareness and gains a bonus to convince others to help in fulfilling their directive.","cost":"One Rouse Check","prerequisite":"Mesmerize","amalgam":"No","duration":"Until the command is carried out or the scene ends","pool":"N/A","opposed":"N/A","notes":"Still pay a Rouse and roll for Mesmerize. This power doesn't let the dominated target supernaturally compel others, but allows them to better convince others to aid them.","source":"Courts of the Damned, page 215","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.ancestral-dominion":{"canonical":"","effect":"Urge a descendant to act even if against their own opinion.","cost":"One Rouse Check","prerequisite":"Mesmerize","amalgam":"Blood Sorcery ●●","duration":"Until the command is carried out or the scene ends","pool":"Manipulation + Dominate","opposed":"Resolve + Occult","notes":"For each generation separating them, the target gains an additional die to resist.","source":"Cults of the Blood Gods, page 104 Players Guide, page 74","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.implant-suggestion":{"canonical":"","effect":"Change another’s personality or opinion temporarily.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Presence ●","duration":"One scene","pool":"Manipulation + Dominate","opposed":"Composure + Resolve","notes":"No test required for unprepared mortals unless it’s a change that opposes their core beliefs.","source":"Players Guide, page 74","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.rationalize":{"canonical":"","effect":"Convince victims of Dominate it was their idea the entire time.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Indefinitely","pool":"N/A","opposed":"N/A","notes":"If pressed on their actions the victim can make a test and if successful they question their actions.","source":"Corebook, page 257","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.tabula-rasa":{"canonical":"","effect":"Erase the victim's memory to the point they don't know who they are.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"Permanent","pool":"Resolve + Dominate","opposed":"Composure + Resolve","notes":"Following this power's use is generally a string of lies and Path Indoctrination.","source":"Sabbat, page 47","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.lethes-call":{"canonical":"","effect":"Erase weeks' worth of memory.","cost":"One Rouse Check","prerequisite":"Cloud Memory or Forgetful Mind","amalgam":"No","duration":"Indefinitely","pool":"Manipulation + Dominate","opposed":"Intelligence + Resolve","notes":"Unprepared mortals cannot test to resist the power. With a verbal command only memories surrounding the spoken subject will be erased.","source":"Gehenna War, page 46","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.mass":{"canonical":"","effect":"Extend effects of Dominate to multiple targets.","cost":"One Rouse Check in addition to power it's added to","prerequisite":"None","amalgam":"No","duration":"As per power amplified","pool":"N/A","opposed":"N/A","notes":"The victims need to see the eyes of the user. The user makes the roll against the strongest of the group.","source":"Corebook, page 257","url":"https://vtm.paradoxwikis.com/Dominate"},"dominate.terminal":{"canonical":"","effect":"Bolster effects of Dominate to be able to circumvent victims' self-preservation.","cost":"Free but will give Stains","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"Terminal commands are always resisted instead of auto failing.","source":"Corebook, page 257","url":"https://vtm.paradoxwikis.com/Dominate"},"obfuscate.cloak":{"canonical":"","effect":"As long as the user stands still they blend into their surroundings.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"Follows the general rules for Obfuscate.","source":"Corebook, page 261","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.ensconce":{"canonical":"","effect":"Make others ignore small objects that are held on the vampire's body.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"Sense Unseen can pierce this power.","source":"Gehenna War, page 46","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.silence":{"canonical":"","effect":"Nullifies the sounds a user makes.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"This power does not eliminate powers made outside of the user's personal space.","source":"Corebook, page 261","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.mask-of-ages":{"canonical":"","effect":"Appear as an older or younger version of themselves.","cost":"One Rouse Check","prerequisite":"No","amalgam":"No","duration":"Until sunrise or ended by user","pool":"N/A","opposed":"N/A","notes":"Storytellers may limit the amount of bonus dice dependent on the number of decades between their projected and real age.","source":"Live from the Succubus Club, page 28","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.cache":{"canonical":"","effect":"Hide objects that are not held by the vampire.","cost":"One Rouse Check","prerequisite":"Ensconce","amalgam":"No","duration":"One scene or until dawn","pool":"N/A","opposed":"N/A","notes":"This can be extended for the duration of the night with an extra rouse check.","source":"Gehenna War, page 47","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.cover":{"canonical":"","effect":"Create brief but realistic hallucinations.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Presence ●","duration":"One turn","pool":"Manipulation + Obfuscate","opposed":"Composure + Wits","notes":"This can be used in combat but can only affect targets once per conflict.","source":"Companion, page 25 Players Guide, page 76","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.ghosts-passing":{"canonical":"","effect":"The user can bestow Obfuscate onto an animal's tracks.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Animalism ●","duration":"One session","pool":"N/A","opposed":"N/A","notes":"Sense the Unseen can discern signs as per general Obfuscate rules","source":"Forbidden Religions, page 18","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.passage":{"canonical":"","effect":"The user can now move while remaining hidden.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene or until detection","pool":"N/A","opposed":"N/A","notes":"This power will fail if the user is being actively watched when activated.","source":"Corebook, page 261","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.ventriloquism":{"canonical":"","effect":"Throw their voice so only the intended recipient can hear it.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●●","duration":"One scene","pool":"Wits + Obfuscate","opposed":"Resolve + Composure","notes":"Can be used on anyone in line of sight.","source":"Fall of London, page 31","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.doubletalk":{"canonical":"","effect":"Say one thing but convey something else in secret.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●","duration":"One utterance","pool":"Composure + Obfuscate","opposed":"Wits + Auspex","notes":"Others present can contest.","source":"Blood Stained Love, page 152","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.fata-morgana":{"canonical":"","effect":"Elaborate hallucinations.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Presence ●●","duration":"One scene, unless let to lapse","pool":"Manipulation + Obfuscate","opposed":"N/A","notes":"If the hallucination can trigger Frenzy, give the test at 1 diff lower than the real thing.","source":"Companion, page 26 Players Guide, page 77","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.machine":{"canonical":"","effect":"Allows the effects of Obfuscate to be transmitted through technology when viewed on a live screen.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"As power used","pool":"N/A","opposed":"N/A","notes":"If viewed later the image seems blurred, making identification harder.","source":"Corebook, page 262","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.faces":{"canonical":"","effect":"Make themselves appear as a mundane face rather than disappear allowing interaction and communication.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"This power allows them to interact and speak to others around them.","source":"Corebook, page 262","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.mask-of-isolation":{"canonical":"","effect":"Force Mask of a Thousand Faces onto a victim.","cost":"One Rouse Check","prerequisite":"Mask of a Thousand Faces","amalgam":"Dominate ●","duration":"One night plus one additional night per margin of success","pool":"Manipulation + Obfuscate","opposed":"Charisma + Insight","notes":"Should the user be made aware of the power being used on them the effects end.","source":"Sabbat, page 48","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.mental-maze":{"canonical":"","effect":"Remove all sense of direction and location from a victim in a location.","cost":"One or Three Rouse Checks","prerequisite":"None","amalgam":"Dominate ●","duration":"One night","pool":"Charisma + Obfuscate","opposed":"Wits + Resolve","notes":"Eye contact is required to activate the power.","source":"Cults of the Blood Gods, page 85 Players Guide, page 77","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.mind-masque":{"canonical":"","effect":"Hide and replace emotions and thoughts against those who wish to read them through supernatural means.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Dominate ●●","duration":"One scene","pool":"Intelligence + Obfuscate","opposed":"N/A","notes":"The difficulty to mask their emotion depends on how complicated they want the ruse to be.","source":"Players Guide, page 78","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.guise-of-the-departed":{"canonical":"","effect":"Copy appearance and mannerism of a recently dead mortal.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Oblivion ●","duration":"Until Dawn","pool":"Wits + Obfuscate","opposed":"N/A","notes":"Sense the Unseen (Auspex 1) can pierce the mask","source":"Tattered Facade, page 98-99","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.conceal":{"canonical":"","effect":"Cloak an inanimate object.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●●●","duration":"One night plus one additional night per margin of success","pool":"Intelligence + Obfuscate","opposed":"N/A","notes":"This power cannot affect anything larger than a two-story house or anything moving on it's own.","source":"Corebook, page 262","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.vanish":{"canonical":"","effect":"Activate Cloak of Shadows or Unseen Passage while being observed.","cost":"As per power augmented","prerequisite":"Cloak of Shadows","amalgam":"No","duration":"As per power augmented","pool":"Wits + Obfuscate","opposed":"Wits + Awareness","notes":"This power makes the memory of mortals foggy and indistinct, but it will not affect the memories of vampires.","source":"Corebook, page 262","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.seclusion":{"canonical":"","effect":"Target is unable to see or hear from any other being, living or unliving.","cost":"One Rouse check","prerequisite":"None","amalgam":"Dominate ●","duration":"Margin number of scenes or nights, or until broken","pool":"Manipulation + Obfuscate","opposed":"Resolve + Awareness","notes":"Physical harm done unto target causes an additional Discipline test for target to resist effect.","source":"Tattered Facade, page 99","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.gathering":{"canonical":"","effect":"Shelter companions under Obfuscate.","cost":"One Rouse Check in additional to the cost of the power extended","prerequisite":"None","amalgam":"No","duration":"As per power extended","pool":"N/A","opposed":"N/A","notes":"This power extends to a number of people equal to the user's Wits, plus additional Rouse Checks.","source":"Corebook, page 263","url":"https://vtm.paradoxwikis.com/Obfuscate"},"obfuscate.impostor":{"canonical":"","effect":"Appear as someone else.","cost":"One Rouse Check","prerequisite":"Mask of a Thousand Faces","amalgam":"No","duration":"One scene","pool":"Wits + Obfuscate","opposed":"Manipulation + Performance","notes":"The face they wish to copy must be studied for at least five minutes from multiple angles.","source":"Corebook, page 263","url":"https://vtm.paradoxwikis.com/Obfuscate"},"oblivion.ashes":{"canonical":"","effect":"Destroy a corpse by dissolving it.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Variable","pool":"Stamina + Oblivion","opposed":"Stamina + Medicine/Fortitude","notes":"If the body is not animated it will dissolve throughout three turns with no test needed.","source":"Cults of the Blood Gods, page 204 Players Guide, page 85","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.binding-fetter":{"canonical":"","effect":"Allow users to be able to identify a fetter by use of their senses.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Wits + Oblivion","opposed":"N/A","notes":"During its use the user receives a -2 penalty to all Awareness, Wits, and Resolve rolls.","source":"Cults of the Blood Gods, page 204 Players Guide, page 85","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.sight":{"canonical":"","effect":"See in darkness clearly and see ghosts present.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"While in use there is a two-dice penalty to social interactions with mortals.","source":"Chicago by Night, page 293 Players Guide, page 85","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.cloak":{"canonical":"","effect":"+2 bonus to stealth rolls and intimidation against mortals.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"N/A","source":"Chicago by Night, page 293 Players Guide, page 85 Fall of London, page 264","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.arms":{"canonical":"","effect":"Conjures shadow appendages that the user can control but the user is unable to do anything else.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Potence ●●","duration":"One scene or until ended or destroyed","pool":"Wits + Oblivion","opposed":"N/A","notes":"Arms do not have a health tracker and do not require Composure + Resolve to escape.","source":"Chicago by Night, page 294 Players Guide, page 86","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.fatal-prediction":{"canonical":"","effect":"Increase the chances of a mortal being harmed by exterior forces.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●●","duration":"24 hours","pool":"Resolve + Oblivion","opposed":"Wits + Occult","notes":"For every success over margin the victim takes 1 Aggravated damage throughout the duration. The vampire cannot interact with the victim directly or indirectly.","source":"Players Guide, page 87","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.fate":{"canonical":"","effect":"Vision of a non-vampires death.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●●","duration":"Until fulfilled, avoided or the story ends","pool":"Resolve + Oblivion","opposed":"N/A","notes":"The vampire must be able to see or hear the target during the power's use.","source":"Cults of the Blood Gods, page 204","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.shadow-cast":{"canonical":"","effect":"Conjure shadows from the user's body.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"The shadow can be extended up to twice the user's Oblivion rating in yards/meters. Those standing in the shadow take more Willpower damage from social conflict","source":"Chicago by Night, page 293 Players Guide, page 87","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.where-the-veil-thins":{"canonical":"","effect":"Determine the density of the Shroud in their area.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Intelligence + Oblivion","opposed":"N/A","notes":"The book lists a chart stating the possible different densities and causes, as well as their effects.","source":"Cults of the Blood Gods, page 205 Players Guide, page 87","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.decay":{"canonical":"","effect":"Harnessing their connection to Oblivion can make plants wilt, animals and humans sick, and food spoil.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Stamina + Oblivion","opposed":"Stamina + Medicine/Fortitude","notes":"All social rolls the vampire makes when this power is active take a two-die penalty. Any contaminated food eaten gives two Superficial Damage.","source":"Cults of the Blood Gods, page 205 Players Guide, page 88","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.passion-feast":{"canonical":"","effect":"Allows a vampire to slake Hunger on the passion of wraiths.","cost":"Free","prerequisite":"None","amalgam":"Fortitude ●●","duration":"Passive","pool":"Resolve + Oblivion","opposed":"Resolve + Composure","notes":"The hunger consumed does not return the following night.","source":"Cults of the Blood Gods, page 206 Players Guide, page 89","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.perspective":{"canonical":"","effect":"Projects their senses into a shadow within line of sight.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Up to one scene","pool":"N/A","opposed":"N/A","notes":"The use of this power is undetectable in the shadow other than by supernatural means such as Sense the Unseen.","source":"Chicago by Night, page 294 Players Guide, page 89","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.shadow-servant":{"canonical":"","effect":"Use a shadow to spy on or scare others.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"The servant has no mind of its own and cannot endure bright lights able to be destroyed by them.","source":"Players Guide, page 89","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.touch":{"canonical":"","effect":"Withers a body part on touch.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"N/A","opposed":"N/A","notes":"Inflicting such damage may warrant Stains up to Storyteller discretion. The user must grip the target.","source":"Chicago by Night, page 294 Players Guide, page 89","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.plague":{"canonical":"","effect":"Manifest illness in victims.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn to activate, variable length of the condition","pool":"Intelligence + Oblivion","opposed":"Stamina + Medicine/Fortitude","notes":"This illness cannot be treated in a medical setting as it's supernaturally inflicted, instead only healed by drinking vitae. There is no outcome on Total Failures.","source":"Cults of the Blood Gods, page 206 Players Guide, page 89","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.profane-the-sanctified":{"canonical":"","effect":"Stun opponents with True Faith and negate its effects, or corrode holy symbols.","cost":"One Rouse Check","prerequisite":"Aura of Decay or Touch of Oblivion","amalgam":"No","duration":"One Turn on opponents, permanent on Holy symbols","pool":"Resolve + Oblivion","opposed":"Willpower Test","notes":"Can be used repeatedly without any additional rouse checks, but does not continue to stun after the first turn.","source":"Tattered Façade, page 100","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.shroud":{"canonical":"","effect":"Darkness spews out of a nearby shadow and covers the area.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"The shadow can be extended up to twice the user's Oblivion rating in yards/meters.","source":"Chicago by Night, page 295 Players Guide, page 90","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.umbrous-clutch":{"canonical":"","effect":"Using the victim's shadow they create a portal, dropping them into the user's arms.","cost":"One Rouse Check, One Stain","prerequisite":"None","amalgam":"No","duration":"Instant","pool":"Wits + Oblivion","opposed":"Dexterity + Wits","notes":"An unprepared mortal will be terrified while a vampire must test for fury or fear Frenzy test at a Difficulty 4.","source":"Sabbat, page 49","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.the-darkness-within":{"canonical":"","effect":"Summon a dark entity from a victim whose only goal is to destroy its host","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One Scene, or until the entity or its host is destroyed","pool":"Manipulation + Oblivion","opposed":"Composure + Resolve","notes":"The Entity has the same skills and disciplines as its host and takes damage like a vampire.","source":"Tattered Façade, page 100","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.step":{"canonical":"","effect":"The user can step into one shadow and appear in another within their sight.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"N/A","opposed":"N/A","notes":"A willing person may be taken through the Shadow Step but should the user stain, so does the passenger.","source":"Chicago by Night, page 295 Players Guide, page 90","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.skuld-fulfilled":{"canonical":"","effect":"Reintroduce illnesses someone has recovered from.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"Variable, depending on if the condition is treatable","pool":"Stamina + Oblivion","opposed":"Stamina + Stamina/Fortitude","notes":"If the victim is a ghoul their immunity to aging is removed and eliminates any vitae in their system.","source":"Cults of the Blood Gods, page 207 Players Guide, page 91","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.avatar":{"canonical":"","effect":"Changes their body into a shadow able to move over any surface or through small spaces.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One scene or until ended","pool":"N/A","opposed":"N/A","notes":"The user takes no damage except sunlight and fire while in this form.","source":"Chicago by Night, page 295 Players Guide, page 91","url":"https://vtm.paradoxwikis.com/Oblivion"},"oblivion.withering-spirit":{"canonical":"","effect":"Erode a victim's spirit till they are a husk.","cost":"Two Rouse Checks, Stains","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Resolve + Oblivion","opposed":"Resolve + Occult/Fortitude","notes":"If the target is Impaired, they will not return as a wraith.","source":"Cults of the Blood Gods, page 208","url":"https://vtm.paradoxwikis.com/Oblivion"},"sorcery.corrosive":{"canonical":"","effect":"Turn vitae corrosive.","cost":"One or more Rouse Checks","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"N/A","opposed":"N/A","notes":"Does not work against unliving flesh, such as other vampires.","source":"Corebook, page 272","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.shape-the-sanguine-sacrament":{"canonical":"","effect":"Shape blood into a shape or image.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"One Scene unless deactivated","pool":"Manipulation + Blood Sorcery","opposed":"N/A","notes":"If the user uses their vitae, it costs one Rouse Check.","source":"Winter's Teeth #3 / Book of Nod Apocrypha, page 33 / / Tattered Façade, page 92","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.taste":{"canonical":"","effect":"Discover traits of another through their blood.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"Resolve + Blood Sorcery","opposed":"N/A","notes":"N/A","source":"Corebook, page 272","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.koldunic-sorcery":{"canonical":"","effect":"Attune with and sense through an element, e.g. Water","cost":"One Rouse Check and Aggravated Health Damage","prerequisite":"Tzimisce","amalgam":"No","duration":"One Scene, Can be renewed","pool":"Resolve + Blood Sorcery","opposed":"Wits or Resolve + Obfuscate","notes":"Can be taken multiple times to attune to other elements","source":"Blood Sigils, page 61","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.bloods-curse":{"canonical":"","effect":"Temporary increase another vampire's Bane Severity.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Until dawn","pool":"Intelligence + Blood Sorcery","opposed":"Stamina + Occult / Fortitude","notes":"If the target is a ghoul, thinblood, or Caitiff they get a clan bane.","source":"Gehenna War, page 48","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.extinguish":{"canonical":"","effect":"In use, this increases another Kindred’s Hunger.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"Intelligence + Blood Sorcery","opposed":"Stamina + Composure","notes":"The victim can determine who used this power against them if they can see them and win an Intelligence + Occult vs Wits + Subterfuge roll.","source":"Corebook, page 272","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.scour-secrets":{"canonical":"","effect":"Pore through a large amount of content within minutes.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One night or till the information is found or there’s a dead-end","pool":"Intelligence + Blood Sorcery","opposed":"N/A","notes":"This power does not allow the user to parse things written in a language they cannot understand.","source":"Players Guide, page 98 / Book of Nod Apocrypha, page 34","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.vinculum-magnum":{"canonical":"","effect":"Raises the limit of Blood Bounds held over other Kindred.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"Tremere and Duskborn cannot benefit from this.","source":"Courts of the Damned, page 214-215","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.potency":{"canonical":"","effect":"Increase Blood Potency temporarily.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One Scene or Night","pool":"Resolve + Blood Sorcery","opposed":"N/A","notes":"This power can allow a Kindred to bypass the Blood Potency limit set by their generation.","source":"Corebook, page 273","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.scorpion":{"canonical":"","effect":"Change own vitae into paralyzing poison.","cost":"One or more Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One Scene","pool":"Strength + Blood Sorcery","opposed":"Stamina + Occult/Fortitude","notes":"A mortal who takes any damage from this will go unconscious.","source":"Corebook, page 273","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.transitive-bond":{"canonical":"","effect":"Extend the properties of Blood Bonding in vitae.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"N/A","opposed":"N/A","notes":"This power was developed originally by the Tremere to combat their bane to only resurface within the Sabbat.","source":"Sabbat, page 49","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.ripples-of-the-heart":{"canonical":"","effect":"Manipulate the blood or Blood of others.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"N/A","opposed":"N/A","notes":"This power can inflict Compulsions on others who feed from the infected or alter the Resonance of a mortal.","source":"Blood Stained Love, page 153","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.theft":{"canonical":"","effect":"Manipulate blood from a victim through the air to feed.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One feeding","pool":"Wits + Blood Sorcery","opposed":"Wits + Occult","notes":"When in use the victim is under the same influence as a standard Kiss.","source":"Corebook, page 274","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.blood-aegis":{"canonical":"","effect":"Form a protective Blood barrier.","cost":"One or more Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One scene or until damage is spent","pool":"N/A","opposed":"N/A","notes":"For each Rouse Check, the user can reduce the damage taken by five points.","source":"Players Guide, page 98","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.fulminating-vitae":{"canonical":"","effect":"Bomb made from jar of vitae.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"Until dawn","pool":"Stamina + Blood Sorcery","opposed":"Wits + Athletics","notes":"Deals Aggravated to Kindred, Superficial to Mortals","source":"Tattered Façade, page 92-93","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.marionette":{"canonical":"","effect":"Control the blood within a body, either living or dead","cost":"One Rouse Checks","prerequisite":"Shape the Sanguine Sacrament","amalgam":"No","duration":"One turn per point of margin","pool":"Manipulation + Blood Sorcery","opposed":"Stamina + Occult or Fortitude","notes":"Dead bodies test against difficulty 2.","source":"Tattered Façade, page 93","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.caress":{"canonical":"","effect":"Change the user's own Vitae into an aggressive and lethal poison.","cost":"One or more Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One Scene","pool":"Strength + Blood Sorcery","opposed":"Stamina + Occult/Fortitude","notes":"If a mortal takes one point of damage they die instantly.","source":"Corebook, page 274","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.cauldron-of-blood":{"canonical":"","effect":"Boil the victim's blood in their body.","cost":"One Rouse Check, Stains","prerequisite":"None","amalgam":"No","duration":"One turn","pool":"Resolve + Blood Sorcery","opposed":"Composure + Occult/Fortitude","notes":"If a mortal takes one point of damage they die screaming.","source":"Corebook, page 274","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"sorcery.reclamation-of-vitae":{"canonical":"","effect":"Reclaim the Blood given to create ghouls over distance.","cost":"One or more Stains","prerequisite":"None","amalgam":"No","duration":"N/A","pool":"N/A","opposed":"N/A","notes":"Those outside of the Sabbat take stains upon use.","source":"Sabbat, page 50","url":"https://vtm.paradoxwikis.com/Blood_Sorcery"},"animalism.famulus":{"canonical":"","effect":"Create an enhanced animal companion.","cost":"Feed the animal a Rouse Check of the vampire's blood on three different nights, if this is purchased at character creation it is considered already done and the player may select an animal to be the famulus.","prerequisite":"None","amalgam":"No","duration":"Only death releases the famulus.","pool":"Charisma + Animal Ken","opposed":"N/A","notes":"Vampires may only have one famulus but you can make animal ghouls without this.","source":"Corebook, page 245","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.sense":{"canonical":"","effect":"Sense hostility and supernatural traits.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"Resolve + Animalism","opposed":"Composure + Subterfuge","notes":"This power can also be used actively.","source":"Corebook, page 245","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.animal-messenger":{"canonical":"","effect":"Use a Famulus to send a message to someone.","cost":"One Rouse Check per night","prerequisite":"None","amalgam":"Auspex ●","duration":"One or more nights based on how long it takes to search","pool":"None","opposed":"None","notes":"The Famulus must test Resolve + Streetwise/Survival if target’s location is unknown against a Difficulty 2 or Intelligence + Streetwise/Survival if the target is actively hiding.","source":"Players Guide, page 69","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.atavism":{"canonical":"","effect":"Revert animals to their base and primal instincts.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Number of rounds equal to margin +1 or entire scene if it's a Critical win","pool":"Composure + Animalism","opposed":"N/A","notes":"The target must be able to sense the user for this power to work.","source":"Winter's Teeth #3","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.whispers":{"canonical":"","effect":"Two-way communication with animals or summoning.","cost":"One Rouse Check per type of animal","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Manipulation/Charisma + Animalism","opposed":"N/A","notes":"The cost is free if used on their Famulus.","source":"Corebook, page 246","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.leash-the-beast":{"canonical":"","effect":"Channel their Blood to prevent the Beast from awakening.","cost":"One or Two Rouse Checks","prerequisite":"None","amalgam":"Fortitude ●","duration":"N/A","pool":"N/A","opposed":"N/A","notes":"This can also be used to turn one die's failure into a success with Frenzy tests.","source":"Live from the Succubus Club, page 27","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.tracing-the-blood":{"canonical":"","effect":"Understand how others Rouse the Blood detecting Blood Surges, Blush of Life, or Disciplines.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Resolve + Animalism","opposed":"N/A","notes":"Must be in sensory range. Margin determines amount of info obtained. Normal win gives general direction, crit gives precise target.","source":"Courts of the Damned, page 214","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.messengers-command":{"canonical":"","effect":"Use Compel or Mesmerize through a Famulus.","cost":"None","prerequisite":"Animal Messenger and Compel or Mesmerize","amalgam":"Dominate ●","duration":"See Animal Messenger","pool":"See Compel or Mesmerize","opposed":"See Compel or Mesmerize","notes":"Dominate rating cannot exceed the Animalism rating.","source":"Players Guide, page 69","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.succulence":{"canonical":"","effect":"Slake additional hunger from animals and counts Blood Potency as 2 levels lower in regards to slaking penalties.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"This will never let the character slake to 0.","source":"Corebook, page 246","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.plague-of-beasts":{"canonical":"","effect":"Mark an individual as a target of animal attention.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One Night","pool":"Manipulation + Animalism","opposed":"Composure + Animal Ken","notes":"The target takes the margin of the win as a penalty against Skill pools except Physical, this also makes them easier to track down.","source":"Players Guide, page 69","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.quell":{"canonical":"","effect":"Force a vampire's beast to slumber or make a mortal lethargic.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Charisma + Animalism","opposed":"Stamina + Resolve","notes":"Against Vampires this lasts several turns equal to test margin +1.","source":"Corebook, page 246","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.scent-of-prey":{"canonical":"","effect":"Track a mortal down who has witnessed a masquerade breach.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"Resolve + Animalism","opposed":"N/A","notes":"It lasts one night if Critical Win.","source":"Sabbat, page 47","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.unliving-hive":{"canonical":"","effect":"Extends Animalism influence to swarms of insects.","cost":"None","prerequisite":"None","amalgam":"Obfuscate ●●","duration":"Passive","pool":"N/A","opposed":"N/A","notes":"Swarms are treated as single creatures.","source":"Corebook, page 246","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.augury":{"canonical":"","effect":"Force a swarm to form an answer to a question.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Auspex ●","duration":"A few minutes","pool":"Manipulation + Animalism","opposed":"N/A","notes":"Animalism tests increase in Difficulty by 1 for rest of the session.","source":"Vampire: The Masquerade Tattered Façade, page 89-90","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.awaken-the-parasite":{"canonical":"","effect":"Awaken bugs within the body of a victim.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One Scene","pool":"Resolve + Animalism","opposed":"Composure + Resolve or Stamina + Wits (If mortal)","notes":"Vampires can use this power on themselves to instill fear or disgust, they suffer a two-dice penalty for the duration of this scene.","source":"Vampire: The Masquerade Tattered Façade, page 90","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.subsume":{"canonical":"","effect":"Possess the body of an animal.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene / Indefinitely","pool":"Manipulation + Animalism","opposed":"N/A","notes":"The cost is free if used on their Famulus.","source":"Corebook, page 247","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.sway-the-flock":{"canonical":"","effect":"Influence animals within an area to behave a certain way.","cost":"One or more Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One night","pool":"Composure + Animalism","opposed":"N/A","notes":"The amount of successes determine how influenced the animals are, the Discipline’s range can be increased per Rouse Check.","source":"Players Guide, page 69","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.dominion":{"canonical":"","effect":"Command flocks or packs of animals.","cost":"Two Rouse Checks","prerequisite":"None","amalgam":"No","duration":"One scene or when the directive is fulfilled","pool":"Charisma + Animalism","opposed":"N/A","notes":"This power does not summon animals, instead utilizing those already present.","source":"Corebook, page 247","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.coax-the-bestial-temper":{"canonical":"","effect":"Either increase or decrease the Difficulty to resist Frenzy for vampires nearby.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"As long as the user keeps humming","pool":"Manipulation + Animalism","opposed":"N/A","notes":"Each success of margin increases or decreases the difficulty","source":"Players Guide, page 70","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.draw":{"canonical":"","effect":"Transfer their terror or fury frenzy to a nearby victim.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"Frenzy Duration","pool":"Wits + Animalism","opposed":"Composure + Resolve","notes":"This power cannot transfer Hunger Frenzy.","source":"Corebook, page 247","url":"https://vtm.paradoxwikis.com/Animalism"},"animalism.spirit-walk":{"canonical":"","effect":"Extends Subsume the Spirit to transfer the vampire's consciousness from one animal to another without retreating to their own body.","cost":"None","prerequisite":"Subsume the Spirit","amalgam":"No","duration":"Indefinite","pool":"N/A","opposed":"N/A","notes":"The duration is as though a critical success was rolled.","source":"Gehenna War, page 46","url":"https://vtm.paradoxwikis.com/Animalism"},"protean.eyes":{"canonical":"","effect":"Allows the user to see in total darkness.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"As long as desired","pool":"N/A","opposed":"N/A","notes":"+2 bonus dice to intimidation against mortals when active.","source":"Corebook, page 269","url":"https://vtm.paradoxwikis.com/Protean"},"protean.squirm":{"canonical":"","effect":"Turn flesh and bones rubbery, allowing the user to squeeze and fit through tight spaces","cost":"Free or One Rouse Check","prerequisite":"None","amalgam":"No","duration":"As long as desired","pool":"N/A","opposed":"N/A","notes":"If a rouse check is spent, the user can fit into even impossibly tight spaces about two inches in diameter.","source":"Tattered Façade, page 105","url":"https://vtm.paradoxwikis.com/Protean"},"protean.feather":{"canonical":"","effect":"The user can make themselves almost weightless.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"As long as desired","pool":"Wits + Survival","opposed":"N/A","notes":"Wits + Survival is only used when activated as a reaction.","source":"Corebook, page 269","url":"https://vtm.paradoxwikis.com/Protean"},"protean.weapons":{"canonical":"","effect":"Elongate the user's nails into claws, gaining a +2 modifier to damage or elongate their fangs and not suffer a called shot penalty.","cost":"One Rouse Check","prerequisite":"None","amalgam":"No","duration":"One scene","pool":"N/A","opposed":"N/A","notes":"Superficial damage inflicted by the user is not halved while active.","source":"Corebook, page 270","url":"https://vtm.paradoxwikis.com/Protean"},"protean.vicissitude":{"canonical":"","effect":"Sculpt the flesh of bodies allowing changes to their own bodies.","cost":"One Rouse Check","prerequisite":"None","amalgam":"Dominate ●●","duration":"Permanent","pool":"Resolve + Protean","opposed":"N/A","notes":"Each succe
