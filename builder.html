function noRule(v){return !v||/^(N\/A|No|None)$/i.test(cleanRule(v))}
function requirementText(r){const x=[];if(!noRule(r.prerequisite)){const label=hasNonPowerPrerequisite(r)?"Eligibility condition — confirm with GM: ":"Required power: ";x.push(label+cleanRule(r.prerequisite))}if(!noRule(r.amalgam))x.push("Required Discipline: "+cleanRule(r.amalgam));return x.join(" · ")||"None"}
function powerGuideHtml(d,p){const r=POWER_RULES[p[0]],roll=noRule(r.pool)?"No roll":cleanRule(r.pool),opposed=noRule(r.opposed)?"No opposing roll":cleanRule(r.opposed),alias=r.canonical&&r.canonical!==p[1]?'<p class="powernote"><b>V5 reference name:</b> '+esc(r.canonical)+'</p>':"";return alias+'<div class="powerguide"><span><b>Effect</b>'+esc(cleanRule(r.effect))+'</span><span><b>Cost</b>'+esc(cleanRule(r.cost))+'</span><span><b>Duration</b>'+esc(cleanRule(r.duration))+'</span><span><b>Roll</b>'+esc(roll)+'</span><span><b>Opposed by</b>'+esc(opposed)+'</span><span><b>Requirements</b>'+esc(requirementText(r))+'</span><span><b>Important rule</b>'+esc(cleanRule(r.notes))+'</span><span><b>Rules source</b><a href="'+esc(r.url)+'" target="_blank" rel="noreferrer">'+esc(cleanRule(r.source))+'</a></span></div>'}
function powerCompareCardHtml(d,p,current){const r=POWER_RULES[p[0]],roll=noRule(r.pool)?"No roll":cleanRule(r.pool),opposed=noRule(r.opposed)?"No opposing roll":cleanRule(r.opposed),alias=r.canonical&&r.canonical!==p[1]?" · V5: "+r.canonical:"",selected=current===p[0],issue=powerRequirementIssue(p),status=issue?"Not yet met: "+issue:hasNonPowerPrerequisite(r)?"Selectable; confirm the listed eligibility condition with the GM.":"Requirements met.";return '<article class="comparecard'+(selected?" selected":"")+'"><h4>'+esc(p[1])+'</h4><p class="meta">'+esc(d)+' · Level '+p[2]+esc(alias)+'</p><p><b>Effect:</b> '+esc(cleanRule(r.effect))+'</p><p><b>Cost:</b> '+esc(cleanRule(r.cost))+' · <b>Duration:</b> '+esc(cleanRule(r.duration))+'</p><p><b>Roll:</b> '+esc(roll)+'</p><p><b>Opposed by:</b> '+esc(opposed)+'</p><p><b>Requirements:</b> '+esc(requirementText(r))+'</p><p class="powernote"><b>Current build:</b> '+esc(status)+'</p><p><b>Important:</b> '+esc(cleanRule(r.notes))+'</p><p class="source micro">Source: <a href="'+esc(r.url)+'" target="_blank" rel="noreferrer">'+esc(cleanRule(r.source))+'</a></p><button type="button" class="btn ghost small choose-power" data-power="'+esc(p[0])+'"'+(selected?" disabled":"")+'>'+(selected?"Selected":"Choose this power")+'</button></article>'}
function powerReviewHtml(d,p){const r=p.rules||POWER_RULES[p.id],roll=noRule(r.pool)?"No roll":cleanRule(r.pool),opposed=noRule(r.opposed)?"No opposing roll":cleanRule(r.opposed),alias=r.canonical&&r.canonical!==p.name?' · V5: '+esc(r.canonical):"";return '<div class="powercard"><b>'+esc(p.name)+'</b> <span>Level '+p.level+" · power choice "+p.acquisitionSlot+alias+'</span><div class="review-line">'+esc(cleanRule(r.effect))+'</div><div class="powerguide"><span><b>Cost</b>'+esc(cleanRule(r.cost))+'</span><span><b>Duration</b>'+esc(cleanRule(r.duration))+'</span><span><b>Roll</b>'+esc(roll)+'</span><span><b>Opposed by</b>'+esc(opposed)+'</span><span><b>Requirements</b>'+esc(requirementText(r))+'</span><span><b>Important rule</b>'+esc(cleanRule(r.notes))+'</span></div><p class="source micro">Source: <a href="'+esc(r.url)+'" target="_blank" rel="noreferrer">'+esc(cleanRule(r.source))+'</a></p></div>'}
function normalizedPowerName(value){return cleanRule(value).normalize("NFKD").replace(/[’‘]/g,"'").replace(/[^a-zA-Z0-9]+/g," ").trim().toLowerCase()}
function selectedPowerNames(){return new Set(S.build.disciplineSlots.flatMap(function(s){return Object.values(s.powers).map(function(id){const q=getPower(s.name,id);return q?normalizedPowerName(q[1]):""}).filter(Boolean)}))}
function cataloguePowerNames(){return new Set(DISCIPLINES.flatMap(function(d){return POWERS[d].list.map(function(p){return normalizedPowerName(p[1])})}))}
function prerequisiteTokens(value){return cleanRule(value).split(/\s+(?:and|or)\s+/i).map(function(x){return x.trim()}).filter(Boolean)}
function hasNonPowerPrerequisite(r){if(noRule(r.prerequisite))return false;const catalogue=cataloguePowerNames();return prerequisiteTokens(r.prerequisite).some(function(x){return !catalogue.has(normalizedPowerName(x))})}
function powerRequirementIssue(p){const r=POWER_RULES[p[0]];if(!r)return "Missing rules card for "+p[1]+".";if(!noRule(r.prerequisite)){const owned=selectedPowerNames(),catalogue=cataloguePowerNames(),clauses=cleanRule(r.prerequisite).split(/\s+and\s+/i),missing=[];clauses.forEach(function(clause){const choices=clause.split(/\s+or\s+/i).map(function(x){return x.trim()}).filter(Boolean),known=choices.filter(function(x){return catalogue.has(normalizedPowerName(x))});if(known.length&&!known.some(function(x){return owned.has(normalizedPowerName(x))}))missing.push(known.join(" or "))});if(missing.length)return p[1]+" requires "+missing.join(" and ")+"."}if(!noRule(r.amalgam)){const m=cleanRule(r.amalgam).match(/^(.+?)\s+([●•]+)$/);if(m){const need=m[2].length,slot=S.build.disciplineSlots.find(function(s){return s.name===m[1]});if(!slot||slot.rating<need)return p[1]+" requires "+m[1]+" "+need+"."}}return ""}
function pathExample(name){return name==="Apex"?"You enter play with one unmistakable level-5 signature. Best when you want a clear defining power and two supporting tools.":name==="Dual Crown"?"You have two equally serious answers to problems. Best when the character has two dominant identities, such as ruler and sorcerer.":"All three power sets matter in most sessions. Best when flexibility is more important than reaching level 5."}

function learnIntro(c){c.innerHTML='<p class="eyebrow">Las Vegas · 1999</p><h2>Create your divine heir</h2><p class="lead">This tool creates a powerful supernatural character for a campaign set in Las Vegas. You do not need to know the rules before you begin. When a choice affects play, that step explains the rule and shows an example.</p><div class="examplecard"><h3>What you will choose</h3><p>First choose your divine heritage and public identity. Then choose your Domains, Attributes, Skills, supernatural powers, unique Miracle, resources, and personal ties. The last page explains how to use the finished character during a session.</p></div><div class="playcard section"><h3>What you need to know now</h3><p>Make the character you want to play in Las Vegas. Heritage and Domains provide themes and story ideas. Your later choices of Attributes, Skills, and powers determine what the character can do under the rules.</p></div><details class="rules"><summary>Show the eight creation steps</summary><div class="grid3"><div><h3>Identity</h3><p class="review-line">Choose heritage, public identity, Domains, operation, Ambition, and Desire.</p></div><div><h3>Abilities</h3><p class="review-line">Choose Attributes, Skills, Specialties, ten supernatural power dots, and a unique Miracle.</p></div><div><h3>Support and ties</h3><p class="review-line">Choose belief, Advantages, complications, Convictions, and Touchstones.</p></div></div></details>'}

function learnConcept(c){c.innerHTML='<p class="eyebrow">Step 1 · Mortal face</p><h2>What does Vegas see?</h2><p class="lead">These are story choices, so they remain open. They do not lock mechanics. Their job is to tell everyone what kinds of scenes your character naturally creates.</p><div class="grid2"><div class="field"><label class="label">Name</label><input class="input" id="name" placeholder="Public name, title, or stage name"></div><div class="field"><label class="label">Public concept</label><input class="input" id="concept" placeholder="Who are you in one vivid phrase?">'+ideaButtons("concept",FIELD_IDEAS.concept)+'</div></div><div class="field"><label class="label">Vegas operation</label><textarea class="input" id="operation" placeholder="What organization, venue, company, network, or territory puts your power into the city?"></textarea>'+ideaButtons("operation",FIELD_IDEAS.operation)+'</div><div class="grid2"><div class="field"><label class="label">Ambition · your long game</label><input class="input" id="ambition" placeholder="A campaign-scale objective">'+ideaButtons("ambition",FIELD_IDEAS.ambition)+'</div><div class="field"><label class="label">Desire · what you want now</label><input class="input" id="desire" placeholder="A goal you could pursue next session">'+ideaButtons("desire",FIELD_IDEAS.desire)+'</div></div><div class="playcard"><h3>At the table</h3><p>Your <b>concept</b> helps frame what you know. Your <b>operation</b> gives you people and places to act through. Your <b>Ambition</b> drives the campaign; your <b>Desire</b> gives the GM a scene to put in front of you immediately.</p></div>';bind("name",S.f,"name");bind("concept",S.f,"concept");bind("operation",S.f,"vegasOperation");bind("ambition",S.f,"ambition");bind("desire",S.f,"desire");["concept","operation","ambition","desire"].forEach(function(k){bindIdeas(c,k,S.f,k==="operation"?"vegasOperation":k,k==="operation"?"operation":k)})}

function learnHeritage(c){c.innerHTML='<p class="eyebrow">Step 2 · Divine heritage</p><h2>Whose legacy runs in you?</h2><p class="lead">Choose an established heir or create your own. Heritage describes expectations, relationships, and symbolism. It is <b>not a class</b>: it grants no locked Attribute, Skill, Discipline, or power.</p><div class="tiles" id="seeds"></div><div class="section"><div class="grid2"><div class="field"><label class="label">Divine parent or parents</label><input class="input" id="sire" placeholder="For example: Hades, Loki, Bragi × Zeus"></div><div class="field"><label class="label">Pantheon or tradition</label><input class="input" id="pantheon" placeholder="For example: Greek, Norse, mixed, or custom"></div></div><div class="field"><label class="label">What did you inherit?</label><textarea class="input" id="inheritance" placeholder="Complete this idea: Because of my heritage, Vegas whispers that I can..."></textarea><p class="fieldhelp">This is fictional permission and a theme, not a substitute for your power selections.</p></div><button class="btn ghost small" id="custom">Keep as custom heritage</button></div><div class="examplecard"><h3>Same parent, different play</h3><p>Two heirs of Loki could be completely different: one might use Obfuscate to infiltrate casinos; another might combine Presence and Dominate to manufacture conspiracies in public. The following steps—not the parent—define how your character acts.</p></div>';const w=c.querySelector("#seeds");SEEDS.forEach(function(s){const t=document.createElement("div");t.className="tile"+(S.build.seedId===s.id?" selected":"");t.innerHTML="<h3>"+esc(s.title)+"</h3><p>"+esc(s.concept)+'</p><div class="meta">'+esc(s.tag)+"</div>";selectable(t,function(){applySeed(s)});w.appendChild(t)});bind("sire",S.f,"sire");bind("pantheon",S.f,"pantheon");bind("inheritance",S.f,"inheritance");c.querySelector("#custom").onclick=function(){S.build.seedId=null;render()}}

function learnDomains(c){const seed=SEEDS.find(function(x){return x.id===S.build.seedId});c.innerHTML='<p class="eyebrow">Step 3 · Divine domains</p><h2>Choose three parts of your legend</h2><p class="lead">A Domain says what kinds of miracles feel natural to your heir. It recommends Skills and Disciplines, but it never controls what you are allowed to select.</p><div class="budget"><span class="pill '+(S.build.domainIds.length===3?'ok':'')+'">domains: '+S.build.domainIds.length+'/3</span></div><div class="tiles" id="domainTiles"></div><div class="playcard section"><h3>How Domains enter play</h3><p>Use them to describe your approach and divine imagery. If your mechanical choice already covers the action, the Domain makes it feel like <i>your</i> miracle. If no rule covers a spectacular but harmless flourish, the GM can simply let the Domain color the scene.</p></div>';const w=c.querySelector("#domainTiles");Object.keys(DOMAINS).forEach(function(id){const d=DOMAINS[id],chosen=S.build.domainIds.includes(id),rec=seed&&seed.rec.includes(id),t=document.createElement("div");t.className="tile"+(chosen?" selected":"")+(rec?" recommended":"");t.innerHTML='<h3>'+esc(d.label)+'</h3><p>'+esc(d.desc)+'</p><p><b>At the table:</b> '+esc(DOMAIN_SCENES[id])+'</p><div class="meta">Skills: '+esc(d.skills.map(cap).join(" · "))+'<br>Powers: '+esc(d.disc.join(" · "))+'</div>';selectable(t,function(){if(chosen)S.build.domainIds=S.build.domainIds.filter(function(x){return x!==id});else if(S.build.domainIds.length<3)S.build.domainIds.push(id);render()});w.appendChild(t)})}

function learnAttributes(c){c.innerHTML='<p class="eyebrow">Step 4 · Attributes</p><h2>How do you approach danger?</h2><p class="lead">Attributes describe <b>how</b> you act. The GM combines one with a Skill. Assign one 5, one 4, three 3s, three 2s, and one 1.</p>'+ratingScale()+'<div class="examplecard"><h3>Approach changes the pool</h3><p>To enter a guarded office, force might use <b>Strength + Brawl</b>, charm might use <b>Charisma + Persuasion</b>, and a forged story might use <b>Manipulation + Subterfuge</b>. Describe the approach you want; the GM names the pool.</p></div><button class="btn ghost small" id="reset">Reset to 1</button><div class="columns section" id="cols"></div><div class="budget" id="budget"></div>';const cols=c.querySelector("#cols");Object.keys(ATTR).forEach(function(g){const col=document.createElement("div");col.innerHTML="<h3>"+g+"</h3>";ATTR[g].forEach(function(k){const i=ATTR_INFO[k];col.appendChild(learningDotRow(k,S.attr[k],1,function(v){S.attr[k]=v;lastRoll=null;render()},false,false,[i.does,i.example]))});cols.appendChild(col)});const cc=counts(S.attr,ALL_ATTR),budget=c.querySelector("#budget");[5,4,3,2,1].forEach(function(n){budget.insertAdjacentHTML("beforeend",pill("rating "+n,cc[n]||0,ATTR_TARGET[n]))});c.querySelector("#reset").onclick=function(){S.attr=blankMap(ALL_ATTR,1);render()}}

function learnSkills(c){const rec=recSkills();c.innerHTML='<p class="eyebrow">Step 5 · Skills</p><h2>What can you reliably do?</h2><p class="lead">Skills describe <b>what</b> you know or have practiced. First choose the shape of your competence, then assign its exact ratings. Red names are suggestions from your Domains, never requirements.</p><div class="tiles" id="paths"></div><div id="editor"></div>';const paths=c.querySelector("#paths");Object.keys(SKILL_PATHS).forEach(function(name){const target=SKILL_PATHS[name],shape=[5,4,3,2,1].map(function(n){return target[n]?target[n]+'×'+n:''}).filter(Boolean).join(" · "),t=document.createElement("div");t.className="tile path"+(S.build.skillPath===name?" selected":"");const table=name==="Focused"?"Dominate your chosen scenes but accept clear gaps.":name==="Balanced"?"Have a strong answer in most social, physical, and investigative scenes.":"Know something about nearly everything; rely less on multiple rating-4 specialties.";t.innerHTML='<h3>'+name+'</h3><p>'+table+'</p><div class="shape">'+shape+'</div>';selectable(t,function(){S.build.skillPath=name;render()});paths.appendChild(t)});if(!S.build.skillPath)return;const e=c.querySelector("#editor"),target=SKILL_PATHS[S.build.skillPath];e.innerHTML='<div class="section"><button class="btn ghost small" id="resetSkills">Reset skills</button><div class="hint" style="margin-top:10px">Suggested by your Domains: <b>'+esc(rec.map(cap).join(", ")||"none")+'</b>. You may ignore every suggestion.</div><div class="columns section" id="skillCols"></div><div class="budget" id="skillBudget"></div><div class="section"><h3>Five Specialties</h3><p class="review-line">A Specialty adds one die when its narrow situation applies. Choose from the examples or write your own. At least one must belong to your rating-5 Skill.</p><div class="grid2" id="specs"></div></div></div>';const cols=e.querySelector("#skillCols");Object.keys(SKILL).forEach(function(g){const col=document.createElement("div");col.innerHTML="<h3>"+g+"</h3>";SKILL[g].forEach(function(k){col.appendChild(learningDotRow(k,S.skill[k],0,function(v){S.skill[k]=v;lastRoll=null;render()},false,rec.includes(k),SKILL_INFO[k]))});cols.appendChild(col)});const cc=counts(S.skill,ALL_SKILLS),budget=e.querySelector("#skillBudget");[5,4,3,2,1].forEach(function(n){if(target[n])budget.insertAdjacentHTML("beforeend",pill("rating "+n,cc[n]||0,target[n]))});const specs=e.querySelector("#specs");[0,1,2,3,4].forEach(function(i){const x=S.build.specialties[i],box=document.createElement("div");box.className="box technical";box.innerHTML='<div class="field"><label class="label">Specialty '+(i+1)+' · Skill</label><select class="input" id="specSkill'+i+'"><option value="">— choose a rated Skill —</option>'+ALL_SKILLS.filter(function(k){return S.skill[k]>0}).map(function(k){return '<option value="'+esc(k)+'"'+(x.skill===k?' selected':'')+'>'+esc(cap(k))+' '+S.skill[k]+'</option>'}).join("")+'</select></div><div class="field"><label class="label">Choose a focus</label><select class="input guide-select" id="specPick'+i+'">'+guideOptions(x.focus,x.skill?(SPECIALTY_IDEAS[x.skill]||[]):[])+'</select><input class="input" id="focus'+i+'" placeholder="Chosen example or custom narrow focus"></div>';specs.appendChild(box);box.querySelector("#specSkill"+i).onchange=function(ev){x.skill=ev.target.value;x.focus="";render()};bind("focus"+i,x,"focus");bindGuide("specPick"+i,"focus"+i,x,"focus")});e.querySelector("#resetSkills").onclick=function(){S.skill=blankMap(ALL_SKILLS,0);S.build.specialties=Array.from({length:5},function(){return {skill:"",focus:""}});render()}}

function learnPowers(c){const rec=recDiscs();c.innerHTML='<p class="eyebrow">Step 6 · Supernatural powers</p><h2>What do you do when ordinary methods are not enough?</h2><p class="lead">Choose a ten-dot shape, then three distinct Disciplines and one power for every numbered choice. Open the comparison under a choice to read the power cards available at that choice before deciding. The complete card remains under the selected power. Recommendations are highlighted; every Discipline remains legal. The builder includes all 215 powers in the VTM Wiki level 1–5 tables. Blood Sorcery rituals and Oblivion ceremonies are separate systems and are not part of these choices.</p><div class="tiles" id="paths"></div><div id="editor"></div>';const paths=c.querySelector("#paths");Object.keys(POWER_PATHS).forEach(function(name){const p=POWER_PATHS[name],t=document.createElement("div");t.className="tile path"+(S.build.powerPath===name?" selected":"");t.innerHTML='<h3>'+esc(name)+'</h3><p>'+esc(p.blurb)+'</p><p><b>At the table:</b> '+esc(pathExample(name))+'</p><div class="shape">'+p.ratings.join(" / ")+' · 10 dots</div>';selectable(t,function(){setPowerPath(name);render()});paths.appendChild(t)});if(!S.build.powerPath)return;const ed=c.querySelector("#editor");ed.innerHTML='<div class="hint section">Suggested by your Domains: <b>'+esc(rec.join(", ")||"none")+'</b>. Stars guide; they do not lock.</div><div class="cardflow"><span><b>1 · Compare</b>Open the comparison under each numbered choice. Read what the powers do, cost, and require.</span><span><b>2 · Choose</b>Select a card. Its complete rules remain visible directly below the selector.</span><span><b>3 · Use in play</b>Name the power and goal, pay the cost, make the listed roll, and apply the effect.</span></div><div class="examplecard"><h3>How to use a power</h3><p>Describe the goal and name the power. If it costs a Rouse Check, roll one die first: 6+ is safe; 1–5 raises Divine Appetite. Then make the listed roll if it has one. A resisted power uses the listed opposing pool.</p></div><div id="slots"></div>';const slots=ed.querySelector("#slots");S.build.disciplineSlots.forEach(function(slot,index){const box=document.createElement("div");box.className="powerbox";const others=S.build.disciplineSlots.map(function(x,i){return i===index?"":x.name}).filter(Boolean),sorted=DISCIPLINES.slice().sort(function(a,b){return (rec.includes(a)?0:1)-(rec.includes(b)?0:1)||a.localeCompare(b)});box.innerHTML='<div class="powerhead"><div class="field"><label class="label">Power set '+(index+1)+'</label><select class="input"><option value="">— choose —</option>'+sorted.map(function(name){return '<option value="'+esc(name)+'"'+(slot.name===name?' selected':'')+(others.includes(name)?' disabled':'')+'>'+(rec.includes(name)?'★ ':'')+esc(name)+' — '+esc(POWERS[name].label)+'</option>'}).join("")+'</select></div><span class="rating">Rating '+slot.rating+'</span></div>'+(slot.name?'<div class="playcard"><h3>'+esc(POWERS[slot.name].label)+' · '+esc(DISC_INFO[slot.name].role)+'</h3><p><b>Typical roll:</b> '+esc(DISC_INFO[slot.name].pool)+'</p><p><b>Typical cost:</b> '+esc(DISC_INFO[slot.name].cost)+'</p><p><b>Vegas example:</b> '+esc(DISC_INFO[slot.name].scene)+'</p></div>':'')+'<div class="picks"></div>';box.querySelector("select").onchange=function(ev){const name=ev.target.value;if(Object.keys(slot.powers).length&&name!==slot.name&&!confirm("Change this Discipline and clear its powers?")){render();return}slot.name=name;slot.powers={};render()};const picks=box.querySelector(".picks");if(slot.name)for(let n=1;n<=slot.rating;n++){const current=slot.powers[n]||"",taken=Object.keys(slot.powers).filter(function(k){return Number(k)!==n}).map(function(k){return slot.powers[k]}),available=POWERS[slot.name].list.filter(function(p){return p[2]<=n&&!taken.includes(p[0])}),row=document.createElement("div");row.className="powerpick";row.innerHTML='<span class="slot">Dot '+n+'</span><div><select class="input"><option value="">— choose a level '+n+' or lower power —</option>'+available.map(function(p){return '<option value="'+esc(p[0])+'"'+(current===p[0]?' selected':'')+'>L'+p[2]+' · '+esc(p[1])+' — '+esc(p[3])+'</option>'}).join("")+'</select>'+(current?powerGuideHtml(slot.name,getPower(slot.name,current)):'<p class="powernote">Select a power to keep its complete card here.</p>')+'<details class="rules powercompare"><summary>Compare '+available.length+' available power cards for choice '+n+'</summary><div class="compare-grid">'+available.map(function(p){return powerCompareCardHtml(slot.name,p,current)}).join("")+'</div></details></div>';row.querySelector("select").onchange=function(ev){if(ev.target.value)slot.powers[n]=ev.target.value;else delete slot.powers[n];render()};row.querySelectorAll(".choose-power").forEach(function(button){button.onclick=function(){slot.powers[n]=button.dataset.power;render()}});picks.appendChild(row)}slots.appendChild(box)})}

function learnSignature(c){const m=S.build.signatureMiracle,a=S.build.signatureAsset,pools=topPools().slice(0,8),rollIdeas=["Automatic"].concat(pools.map(function(x){return cap(x.attr)+" + "+cap(x.skill)})),activationIdeas=["One action and a visible divine gesture","One action while the target can hear or perceive me","One minute of focused observation or ritual","A reaction when the named trigger occurs","One action at a meaningful threshold"],limitIdeas=["The effect is unmistakably supernatural and publicly identifiable as mine.","A resisting target who wins is immune for the rest of the scene.","The effect requires a relevant audience, symbol, place, or offering.","The effect lasts one scene and cannot create permanent wealth or control.","Using it leaves me visibly changed or vulnerable until the scene ends."];c.innerHTML='<p class="eyebrow">Step 7 · Signature divinity</p><h2>Design one miracle with rules you can actually use</h2><p class="lead">The creative effect is yours; the operating structure should be explicit. Start from a template, then rewrite its fiction. The GM can tune edge cases before play.</p><div class="tiles" id="miracleTemplates"></div><div class="section technical"><h3>Signature Miracle</h3><div class="grid2"><div class="field"><label class="label">Name · narrative</label><input class="input" id="mn" placeholder="For example: The Encore That Wakes the Dead"></div><div class="field"><label class="label">Activation · technical</label><select class="input guide-select" id="maPick">'+guideOptions(m.activation,activationIdeas)+'</select><input class="input" id="ma" placeholder="Chosen procedure or custom activation"></div></div><div class="field"><label class="label">Effect · narrative, but precise</label><textarea class="input" id="me" placeholder="Who or what changes? How much? For how long?"></textarea></div><div class="grid2"><div class="field"><label class="label">Roll · technical</label><select class="input guide-select" id="mrPick">'+guideOptions(m.roll,rollIdeas)+'</select><input class="input" id="mr" placeholder="Attribute + Skill, Automatic, or GM-approved custom pool"></div><div class="field"><label class="label">Cost · technical</label><select class="input" id="mc"><option>One Rouse Check</option><option>Two Rouse Checks</option><option>One Rouse Check per scene</option><option>Special condition</option></select><p class="fieldhelp">One Rouse is normal; two is appropriate for scene-scale transformation or creation.</p></div></div><div class="field"><label class="label">Limitation or tell · technical</label><select class="input guide-select" id="mlPick">'+guideOptions(m.limitation,limitIdeas)+'</select><textarea class="input" id="ml" placeholder="Chosen limit or a specific custom limit"></textarea></div></div><div class="section"><div class="section-title"><h3>Signature Asset</h3><span>Fixed rating 4</span></div><p class="review-line">The asset is a recurring tool in play, not just biography. Choose a type and one concrete benefit.</p><div class="grid2"><div class="field"><label class="label">Type</label><select class="input" id="at"><option value="">— choose —</option>'+ASSET_TYPES.map(function(x){return '<option'+(a.type===x?' selected':'')+'>'+x+'</option>'}).join("")+'</select></div><div class="field"><label class="label">Name · ••••</label><input class="input" id="an" placeholder="For example: Bragi’s Electric Harp"></div></div><div class="field"><label class="label">Description · narrative</label><textarea class="input" id="ad" placeholder="What is it, who recognizes it, and why does it matter?"></textarea></div><div class="field technical"><label class="label">Concrete benefit · technical</label><select class="input guide-select" id="abPick">'+guideOptions(a.benefit,ASSET_BENEFITS)+'</select><textarea class="input" id="ab" placeholder="Select a package, then name its exact pool, expert task, access, or reach"></textarea></div></div>';const templates=c.querySelector("#miracleTemplates");MIRACLE_TEMPLATES.forEach(function(t){const box=document.createElement("div");box.className="tile path";box.innerHTML='<div class="template-title"><h3>'+esc(t.label)+'</h3><button class="btn ghost small" type="button">Use structure</button></div><p>'+esc(t.desc)+'</p><div class="meta">'+esc(t.roll)+' · '+esc(t.cost)+'</div>';box.querySelector("button").onclick=function(ev){ev.stopPropagation();if([m.effect,m.activation,m.roll,m.limitation].some(function(x){return x.trim()})&&!confirm("Replace the Miracle structure already entered?"))return;m.effect=t.effect;m.activation=t.activation;m.roll=t.roll;m.cost=t.cost;m.limitation=t.limitation;render()};templates.appendChild(box)});bind("mn",m,"name");bind("ma",m,"activation");bind("me",m,"effect");bind("mr",m,"roll");bind("ml",m,"limitation");bindGuide("maPick","ma",m,"activation");bindGuide("mrPick","mr",m,"roll");bindGuide("mlPick","ml",m,"limitation");c.querySelector("#mc").value=m.cost;c.querySelector("#mc").onchange=function(e){m.cost=e.target.value;validate();persist()};c.querySelector("#at").value=a.type;c.querySelector("#at").onchange=function(e){a.type=e.target.value;validate();persist()};bind("an",a,"name");bind("ad",a,"description");bind("ab",a,"benefit");bindGuide("abPick","ab",a,"benefit")}

function learnTies(c){const used=Object.values(S.build.advantages).reduce(function(a,b){return a+b},0);c.innerHTML='<p class="eyebrow">Step 8 · Belief, empire, and human ties</p><h2>What sustains you—and what can hurt you?</h2><p class="lead">This step creates your resource loop, supporting cast, and hard choices. Technical choices provide menus; you add names and specificity.</p><div class="rulegrid"><div class="rulecard"><h3>Divine Appetite · starts at 1</h3><p>When a power calls for a Rouse Check, roll one die. On 1–5, Appetite rises by one. That many dice in future pools become red Appetite dice.</p></div><div class="rulecard"><h3>Belief Style · how you feed</h3><p>Your style tells the GM what kind of scene can satisfy your divinity. When you meaningfully receive that form of belief, the GM may lower Appetite.</p></div></div><h3>Choose a Belief Style</h3><div class="tiles" id="beliefs"></div><div class="section"><div class="section-title"><h3>Advantages</h3><span>Spend exactly 12 dots</span></div>'+advantageScale()+'<div class="advgrid" id="advs"></div><div class="budget">'+pill("advantage dots",used,12)+'</div></div><div class="section"><h3>Three complications</h3><p class="review-line">Choose an example, then make it specific. A useful complication names who can exploit it or what scene it creates.</p><div class="grid3" id="comps"></div></div><div class="section"><h3>Two moral anchors</h3><p class="review-line">A <b>Conviction</b> is a principle you may defend at a cost. A <b>Touchstone</b> is a specific mortal who embodies it and can pull your story into human-scale scenes.</p><div class="grid2" id="anchors"></div></div>';const beliefs=c.querySelector("#beliefs");BELIEFS.forEach(function(x){const t=document.createElement("div");t.className="tile"+(S.build.beliefStyle===x.id?" selected":"");t.innerHTML='<h3>'+x.label+'</h3><p>'+x.desc+'</p><p><b>Play cue:</b> Seek scenes where people express '+lowerFirst(x.desc)+'</p>';selectable(t,function(){S.build.beliefStyle=x.id;render()});beliefs.appendChild(t)});const adv=c.querySelector("#advs");ADVANTAGES.forEach(function(k){adv.appendChild(learningDotRow(k,S.build.advantages[k],0,function(v){S.build.advantages[k]=v;render()},true,false,ADV_INFO[k]))});for(let i=0;i<3;i++){const box=document.createElement("div");box.className="field technical";box.innerHTML='<label class="label">Complication '+(i+1)+'</label><select class="input guide-select" id="compPick'+i+'">'+guideOptions(S.build.complications[i],COMPLICATION_IDEAS)+'</select><textarea class="input" id="comp'+i+'" placeholder="Selected example, made specific—or custom complication"></textarea>';c.querySelector("#comps").appendChild(box);bindArray("comp"+i,S.build.complications,i);bindGuide("compPick"+i,"comp"+i,S.build.complications,i)}for(let i=0;i<2;i++){const box=document.createElement("div");box.className="box technical";box.innerHTML='<h3>Anchor '+(i+1)+'</h3><div class="field"><label class="label">Conviction</label><select class="input guide-select" id="convPick'+i+'">'+guideOptions(S.build.convictions[i],CONVICTION_IDEAS)+'</select><textarea class="input" id="conv'+i+'" placeholder="Selected principle, adjusted to your heir—or custom conviction"></textarea></div><div class="field"><label class="label">Touchstone · specific mortal</label><textarea class="input" id="touch'+i+'" placeholder="Name, relationship, and how this person embodies the Conviction"></textarea></div>';c.querySelector("#anchors").appendChild(box);bindArray("conv"+i,S.build.convictions,i);bindArray("touch"+i,S.build.touchstones,i);bindGuide("convPick"+i,"conv"+i,S.build.convictions,i)}}

function learnReview(c){const out=serialize(),m=S.build.signatureMiracle,a=S.build.signatureAsset,pools=topPools().slice(0,6),health=S.attr.stamina+3,will=S.attr.composure+S.attr.resolve,low=ALL_ATTR.slice().sort(function(a,b){return S.attr[a]-S.attr[b]})[0],poolRows=pools.map(function(x){return '<tr><td><b>'+cap(x.attr)+' + '+cap(x.skill)+'</b></td><td class="pooldice">'+x.dice+' dice</td><td>'+esc(x.example)+'</td></tr>'}).join(""),powerHtml=out.disc.filter(function(d){return d.name}).map(function(d){return '<div class="powerbox"><div class="section-title"><h3>'+esc(d.name)+' · '+esc(DISC_INFO[d.name].role)+'</h3><span>Rating '+d.rating+"</span></div>"+d.powerList.map(function(p){return powerReviewHtml(d.name,p)}).join("")+"</div>"}).join("");c.innerHTML='<p class="eyebrow">Complete · Las Vegas, 1999</p><h2>'+esc(S.f.name)+'</h2><p class="lead">'+esc(S.f.concept)+' · <b>'+esc(lineage())+'</b></p><div class="playcard success"><h3>Your first-session playbook</h3><p>You are strongest when you describe an approach that reaches one of the pools below. You are not limited to them; they are the reliable starting buttons on your character.</p><table class="pooltable"><thead><tr><th>Pool</th><th>Dice</th><th>Use it like this</th></tr></thead><tbody>'+poolRows+'</tbody></table><p class="fieldhelp">When a Specialty applies, add one die. Current Divine Appetite is 1, so replace one die in the pool with an Appetite die.</p></div><div class="section grid2"><div class="box"><h3>How to make a test</h3><div class="quickref"><p>State your goal and describe the approach.</p><p>The GM names Attribute + Skill and a Difficulty, or the opponent’s pool.</p><p>Build the pool; replace '+S.hunger+' die with an Appetite die.</p><p>Roll. Count 6–9; apply pairs of 10s; compare successes.</p><p>If needed, spend Willpower to reroll up to three ordinary dice.</p></div></div><div class="box"><h3>Your pressure gauges</h3><div class="statline"><span>Health</span><b>'+health+'</b></div><div class="statline"><span>Willpower</span><b>'+will+'</b></div><div class="statline"><span>Divine Potency</span><b>3</b></div><div class="statline"><span>Divine Appetite</span><b>1</b></div><p class="review-line"><b>Rouse:</b> roll one die; 1–5 raises Appetite, 6–10 does not.</p><p class="review-line"><b>Messy critical:</b> a critical using an Appetite 10 succeeds with uncontrolled divine expression.</p><p class="review-line"><b>Bestial failure:</b> a failed roll containing an Appetite 1 lets appetite, instinct, or divine nature make the failure worse.</p></div></div><div class="examplecard danger"><h3>Where play should pressure you</h3><p>Your lowest Attribute is <b>'+cap(low)+' '+S.attr[low]+'</b>: '+esc(ATTR_INFO[low].does)+' Your three Complications and two Touchstones give the GM permission to make success costly and personal; they are story engines, not punishments.</p></div><div class="section"><h2>Your supernatural powers</h2><p class="lead">These are your selected power cards. Use this page during play or print it with the character sheet.</p>'+powerHtml+'</div><div class="review-grid section"><div class="box"><h3>Identity and objective</h3><p class="review-line"><b>Operation:</b> '+esc(S.f.vegasOperation)+'</p><p class="review-line"><b>Ambition:</b> '+esc(S.f.ambition)+'</p><p class="review-line"><b>Desire:</b> '+esc(S.f.desire)+'</p><p class="review-line"><b>Inheritance:</b> '+esc(S.f.inheritance)+'</p></div><div class="box"><h3>Divine profile</h3><p class="review-line"><b>Domains:</b> '+esc(out.f.domains)+'</p><p class="review-line"><b>Power path:</b> '+esc(S.build.powerPath)+' · 10 dots</p><p class="review-line"><b>Belief Style:</b> '+esc(out.f.predator)+'</p><p class="review-line"><b>Skill shape:</b> '+esc(S.build.skillPath)+'</p></div><div class="box"><h3>Signature Miracle</h3><p class="review-line"><b>'+esc(m.name)+'</b> — '+esc(m.effect)+'</p><p class="review-line"><b>Use:</b> '+esc(m.activation)+' · '+esc(m.roll)+' · '+esc(m.cost)+'</p><p class="review-line"><b>Limit:</b> '+esc(m.limitation)+'</p></div><div class="box"><h3>Signature Asset · ••••</h3><p class="review-line"><b>'+esc(a.name)+'</b> · '+esc(a.type)+'</p><p class="review-line">'+esc(a.description)+'</p><p class="review-line"><b>Benefit:</b> '+esc(a.benefit)+'</p></div><div class="box"><h3>Empire</h3><p class="review-line">'+esc(out.f.advantages)+'</p><h3>Complications</h3>'+S.build.complications.map(function(x){return '<p class="review-line">• '+esc(x)+'</p>'}).join("")+'</div><div class="box"><h3>Moral anchors</h3>'+S.build.convictions.map(function(x,i){return '<p class="review-line"><b>'+esc(x)+'</b><br>'+esc(S.build.touchstones[i])+'</p>'}).join("")+'</div></div><details class="rules section"><summary>Complete ratings for reference</summary><div><div class="columns">'+Object.keys(ATTR).map(function(g){return '<div><h3>'+g+'</h3>'+ATTR[g].map(function(k){return '<div class="statline"><span>'+cap(k)+'</span><b>'+S.attr[k]+'</b></div>'}).join("")+'</div>'}).join("")+'</div><div class="columns section">'+Object.keys(SKILL).map(function(g){return '<div><h3>'+g+'</h3>'+SKILL[g].filter(function(k){return S.skill[k]}).map(function(k){return '<div class="statline"><span>'+cap(k)+'</span><b>'+S.skill[k]+'</b></div>'}).join("")+'</div>'}).join("")+'</div><p class="review-line"><b>Specialties:</b> '+esc(out.f.specialties)+'</p></div></details><div class="review-actions" style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="download">Save Vegas character</button><button class="btn ghost" id="copy">Copy character data</button><button class="btn ghost" id="print">Print character + power cards</button><button class="btn ghost" id="edit">‹ Edit</button></div>';c.querySelector("#download").onclick=download;c.querySelector("#copy").onclick=copy;c.querySelector("#print").onclick=function(){print()};c.querySelector("#edit").onclick=function(){step=1;render();scrollTo(0,0)}}
