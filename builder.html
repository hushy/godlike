 first source of physical damage each turn unless sunlight."],["fortitude.prowess-from-pain","Prowess from Pain",5,"No longer suffers penalty from Health damage and can increase one Attribute per level of damage on their tracker."],["fortitude.meat-shields","Meat Shields",5,"Increase Fortitude by a number equal to half the weak mortals present. (Rounded down)"]]},

 "Presence":{"label":"Divine Presence","list":[["presence.awe","Awe",1,"Add Presence rating to any Skill roll involving Persuasion, Performance, or Charisma related rolls as per ST discretion."],["presence.daunt","Daunt",1,"Add Presence rating to any intimidation rolls."],["presence.eyes-of-the-serpent","Eyes of the Serpent",1,"Immobilize a victim by making eye contact."],["presence.fascination","Lingering Kiss",2,"Usable during feedings, the victim gains a bonus to Social attribute for one night."],["presence.melpominee","Melpominee",2,"Use Presence without seeing the target, only having them within earshot."],["presence.predators-lure","Predator's Lure",2,"Use Presence to instill intense curiosity in a target and compel them to approach the user."],["presence.clear-the-field","Clear the Field",3,"Clear a space in a calm and orderly manner."],["presence.dread","Dread Gaze",3,"Instill fear into a target to make them flee."],["presence.entrancement","Entrancement",3,"Influence someone into a star-struck or beguiled state of mind where they do their best to keep the user happy. Adding their Presence rating in dice to any social rolls against the victim."],["presence.passion-leech","Passion Leech",3,"Leech the passion from a mortal target, gaining the benefits of Humanity 10 temporarily."],["presence.thrown-voice","Thrown Voice",3,"Throw their voice from any point within sight and leave the voice there."],["presence.true-loves-face","True Love's Face",3,"The victim will perceive the user as a mortal they have strong emotional ties with, be it hatred or love."],["presence.invigorating-display","Invigorating Display",3,"After interacting with a crowd, a vampire can inhale the energy of the crowd to experience a unique Resonance."],["presence.inflame-desire","Inflame Desire",4,"Boost a victim's current desire, seeking only to satisfy it"],["presence.irresistible-voice","Irresistible Voice",4,"The user's voice alone is enough to use Dominate on a target."],["presence.magnum-opus","Magnum Opus",4,"Infusing Presence into artwork."],["presence.suffuse-the-edifice","Suffuse the Edifice",4,"Extend Presence onto a building."],["presence.summon","Summon",4,"Call someone to them who has had certain Presence powers used on them or tasted the user's vitae."],["presence.wingman","Wingman",4,"Extend Presence onto another character to use."],["presence.majesty","Majesty",5,"Everyone who looks at the user is dumbstruck unable to act in any way other than self-preservation."],["presence.star-magnetism","Star Magnetism",5,"Allows the use of presence through live-feed technology, does not work on recorded content."]]},
 "Dominate":{"label":"Sovereign Will","list":[["dominate.cloud","Cloud Memory",1,"Make someone forget the current moment."],["dominate.compel","Compel",1,"Issue a single command."],["dominate.slavish-devotion","Slavish Devotion",1,"Those already underneath Dominate find it easier to resist other kindred's Dominate."],["dominate.mesmerize","Mesmerize",2,"Issue complex commands."],["dominate.discord","Dementation",2,"Drive others insane."],["dominate.domitors-favor","Domitor's Favor",2,"Make defiance while under a Blood Bond more difficult."],["dominate.the-stolen-voice","The Stolen Voice",2,"Remove a target's ability to express. Unable to speak, write or gesture."],["dominate.forget","Forgetful Mind",3,"Rewrite someone's memory."],["dominate.submerged-directive","Submerged Directive",3,"Implant Dominate orders as suggestions for victims."],["dominate.chain-of-command","Chain of Command",3,"Deliver a Mesmerize command, then invoke this power to allow the target to follow more complex commands with awareness and gains a bonus to convince others to help in fulfilling their directive."],["dominate.ancestral-dominion","Ancestral Dominion",4,"Urge a descendant to act even if against their own opinion."],["dominate.implant-suggestion","Implant Suggestion",4,"Change another’s personality or opinion temporarily."],["dominate.rationalize","Rationalize",4,"Convince victims of Dominate it was their idea the entire time."],["dominate.tabula-rasa","Tabula Rasa",4,"Erase the victim's memory to the point they don't know who they are."],["dominate.lethes-call","Lethe's Call",5,"Erase weeks' worth of memory."],["dominate.mass","Mass Manipulation",5,"Extend effects of Dominate to multiple targets."],["dominate.terminal","Terminal Decree",5,"Bolster effects of Dominate to be able to circumvent victims' self-preservation."]]},
 "Obfuscate":{"label":"Masks and Absence","list":[["obfuscate.cloak","Cloak of Shadows",1,"As long as the user stands still they blend into their surroundings."],["obfuscate.ensconce","Ensconce",1,"Make others ignore small objects that are held on the vampire's body."],["obfuscate.silence","Silence of Death",1,"Nullifies the sounds a user makes."],["obfuscate.mask-of-ages","Mask of Ages",1,"Appear as an older or younger version of themselves."],["obfuscate.cache","Cache",2,"Hide objects that are not held by the vampire."],["obfuscate.cover","Chimerstry",2,"Create brief but realistic hallucinations."],["obfuscate.ghosts-passing","Ghost's Passing",2,"The user can bestow Obfuscate onto an animal's tracks."],["obfuscate.passage","Unseen Passage",2,"The user can now move while remaining hidden."],["obfuscate.ventriloquism","Ventriloquism",2,"Throw their voice so only the intended recipient can hear it."],["obfuscate.doubletalk","Doubletalk",2,"Say one thing but convey something else in secret."],["obfuscate.fata-morgana","Fata Morgana",3,"Elaborate hallucinations."],["obfuscate.machine","Ghost in the Machine",3,"Allows the effects of Obfuscate to be transmitted through technology when viewed on a live screen."],["obfuscate.faces","Mask of a Thousand Faces",3,"Make themselves appear as a mundane face rather than disappear allowing interaction and communication."],["obfuscate.mask-of-isolation","Mask of Isolation",3,"Force Mask of a Thousand Faces onto a victim."],["obfuscate.mental-maze","Mental Maze",3,"Remove all sense of direction and location from a victim in a location."],["obfuscate.mind-masque","Mind Masque",3,"Hide and replace emotions and thoughts against those who wish to read them through supernatural means."],["obfuscate.guise-of-the-departed","Guise of the Departed",3,"Copy appearance and mannerism of a recently dead mortal."],["obfuscate.conceal","Conceal",4,"Cloak an inanimate object."],["obfuscate.vanish","Vanish",4,"Activate Cloak of Shadows or Unseen Passage while being observed."],["obfuscate.seclusion","Seclusion",4,"Target is unable to see or hear from any other being, living or unliving."],["obfuscate.gathering","Cloak the Gathering",5,"Shelter companions under Obfuscate."],["obfuscate.impostor","Impostor's Guise",5,"Appear as someone else."]]},
 "Oblivion":{"label":"Death and Shadow","list":[["oblivion.ashes","Ashes to Ashes",1,"Destroy a corpse by dissolving it."],["oblivion.binding-fetter","Binding Fetter",1,"Allow users to be able to identify a fetter by use of their senses."],["oblivion.sight","Oblivion Sight",1,"See in darkness clearly and see ghosts present."],["oblivion.cloak","Shadow Cloak",1,"+2 bonus to stealth rolls and intimidation against mortals."],["oblivion.arms","Arms of Ahriman",2,"Conjures shadow appendages that the user can control but the user is unable to do anything else."],["oblivion.fatal-prediction","Fatal Prediction",2,"Increase the chances of a mortal being harmed by exterior forces."],["oblivion.fate","Fatal Precognition",2,"Vision of a non-vampires death."],["oblivion.shadow-cast","Shadow Cast",2,"Conjure shadows from the user's body."],["oblivion.where-the-veil-thins","Where the Veil Thins",2,"Determine the density of the Shroud in their area."],["oblivion.decay","Aura of Decay",3,"Harnessing their connection to Oblivion can make plants wilt, animals and humans sick, and food spoil."],["oblivion.passion-feast","Passion Feast",3,"Allows a vampire to slake Hunger on the passion of wraiths."],["oblivion.perspective","Shadow Perspective",3,"Projects their senses into a shadow within line of sight."],["oblivion.shadow-servant","Shadow Servant",3,"Use a shadow to spy on or scare others."],["oblivion.touch","Touch of Oblivion",3,"Withers a body part on touch."],["oblivion.plague","Necrotic Plague",4,"Manifest illness in victims."],["oblivion.profane-the-sanctified","Profane the Sanctified",4,"Stun opponents with True Faith and negate its effects, or corrode holy symbols."],["oblivion.shroud","Stygian Shroud",4,"Darkness spews out of a nearby shadow and covers the area."],["oblivion.umbrous-clutch","Umbrous Clutch",4,"Using the victim's shadow they create a portal, dropping them into the user's arms."],["oblivion.the-darkness-within","The Darkness Within",5,"Summon a dark entity from a victim whose only goal is to destroy its host"],["oblivion.step","Shadow Step",5,"The user can step into one shadow and appear in another within their sight."],["oblivion.skuld-fulfilled","Skuld Fulfilled",5,"Reintroduce illnesses someone has recovered from."],["oblivion.avatar","Tenebrous Avatar",5,"Changes their body into a shadow able to move over any surface or through small spaces."],["oblivion.withering-spirit","Withering Spirit",5,"Erode a victim's spirit till they are a husk."]]},
 "Blood Sorcery":{"label":"Ritual Power","list":[["sorcery.corrosive","Corrosive Vitae",1,"Turn vitae corrosive."],["sorcery.shape-the-sanguine-sacrament","Shape the Sanguine Sacrament",1,"Shape blood into a shape or image."],["sorcery.taste","A Taste for Blood",1,"Discover traits of another through their blood."],["sorcery.koldunic-sorcery","Koldunic Sorcery",1,"Attune with and sense through an element, e.g. Water"],["sorcery.bloods-curse","Blood's Curse",2,"Temporary increase another vampire's Bane Severity."],["sorcery.extinguish","Extinguish Vitae",2,"In use, this increases another Kindred’s Hunger."],["sorcery.scour-secrets","Scour Secrets",2,"Pore through a large amount of content within minutes."],["sorcery.vinculum-magnum","Vinculum Magnum",2,"Raises the limit of Blood Bounds held over other Kindred."],["sorcery.potency","Blood of Potency",3,"Increase Blood Potency temporarily."],["sorcery.scorpion","Scorpion’s Touch",3,"Change own vitae into paralyzing poison."],["sorcery.transitive-bond","Transitive Bond",3,"Extend the properties of Blood Bonding in vitae."],["sorcery.ripples-of-the-heart","Ripples of the Heart",3,"Manipulate the blood or Blood of others."],["sorcery.theft","Theft of Vitae",4,"Manipulate blood from a victim through the air to feed."],["sorcery.blood-aegis","Blood Aegis",4,"Form a protective Blood barrier."],["sorcery.fulminating-vitae","Fulminating Vitae",4,"Bomb made from jar of vitae."],["sorcery.marionette","Marionette",4,"Control the blood within a body, either living or dead"],["sorcery.caress","Baal’s Caress",5,"Change the user's own Vitae into an aggressive and lethal poison."],["sorcery.cauldron-of-blood","Cauldron of Blood",5,"Boil the victim's blood in their body."],["sorcery.reclamation-of-vitae","Reclamation of Vitae",5,"Reclaim the Blood given to create ghouls over distance."]]},
 "Animalism":{"label":"Beasts and Instinct","list":[["animalism.famulus","Bond Famulus",1,"Create an enhanced animal companion."],["animalism.sense","Sense the Beast",1,"Sense hostility and supernatural traits."],["animalism.animal-messenger","Animal Messenger",2,"Use a Famulus to send a message to someone."],["animalism.atavism","Atavism",2,"Revert animals to their base and primal instincts."],["animalism.whispers","Feral Whispers",2,"Two-way communication with animals or summoning."],["animalism.leash-the-beast","Leash the Beast",2,"Channel their Blood to prevent the Beast from awakening."],["animalism.tracing-the-blood","Tracing the Blood",2,"Understand how others Rouse the Blood detecting Blood Surges, Blush of Life, or Disciplines."],["animalism.messengers-command","Messenger's Command",3,"Use Compel or Mesmerize through a Famulus."],["animalism.succulence","Animal Succulence",3,"Slake additional hunger from animals and counts Blood Potency as 2 levels lower in regards to slaking penalties."],["animalism.plague-of-beasts","Plague of Beasts",3,"Mark an individual as a target of animal attention."],["animalism.quell","Quell the Beast",3,"Force a vampire's beast to slumber or make a mortal lethargic."],["animalism.scent-of-prey","Scent of Prey",3,"Track a mortal down who has witnessed a masquerade breach."],["animalism.unliving-hive","Unliving Hive",3,"Extends Animalism influence to swarms of insects."],["animalism.augury","Augury",3,"Force a swarm to form an answer to a question."],["animalism.awaken-the-parasite","Awaken the Parasite",3,"Awaken bugs within the body of a victim."],["animalism.subsume","Subsume the Spirit",4,"Possess the body of an animal."],["animalism.sway-the-flock","Sway the Flock",4,"Influence animals within an area to behave a certain way."],["animalism.dominion","Animal Dominion",5,"Command flocks or packs of animals."],["animalism.coax-the-bestial-temper","Coax the Bestial Temper",5,"Either increase or decrease the Difficulty to resist Frenzy for vampires nearby."],["animalism.draw","Drawing Out the Beast",5,"Transfer their terror or fury frenzy to a nearby victim."],["animalism.spirit-walk","Spirit Walk",5,"Extends Subsume the Spirit to transfer the vampire's consciousness from one animal to another without retreating to their own body."]]},
 "Protean":{"label":"Divine Metamorphosis","list":[["protean.eyes","Eyes of the Beast",1,"Allows the user to see in total darkness."],["protean.squirm","Squirm",1,"Turn flesh and bones rubbery, allowing the user to squeeze and fit through tight spaces"],["protean.feather","Weight of the Feather",1,"The user can make themselves almost weightless."],["protean.weapons","Feral Weapons",2,"Elongate the user's nails into claws, gaining a +2 modifier to damage or elongate their fangs and not suffer a called shot penalty."],["protean.vicissitude","Vicissitude",2,"Sculpt the flesh of bodies allowing changes to their own bodies."],["protean.serpents-kiss","Serpent's Kiss",2,"When biting someone, inject their own vitae into them."],["protean.the-false-sip","The False Sip",2,"Prevent any blood or Blood from entering their system."],["protean.earth","Earth Meld",3,"Sink into the earth and become one with the soil."],["protean.fleshcrafting","Fleshcrafting",3,"Extends the mastery over the flesh to be used on others."],["protean.shape","Shapechange",3,"Change into an animal with a similar body mass."],["protean.visceral-absorption","Visceral Absorption",3,"Draw in the remains of blood and body to the vampire to clean a scene."],["protean.masque-of-death","Masque of Death",3,"Take on the appearance of a corpse, and while unable to move or communicate, they take any damage only if it deals Aggravated damage."],["protean.horrid-form","Horrid Form",4,"Take on a monstrous shape."],["protean.metamorphosis","Metamorphosis",4,"Extends shape change by granting it an additional form. The size of their new form isn't restricted by the vampire's mass."],["protean.blood-form","Blood Form",5,"Turn into an amorphous mass of blood."],["protean.the-heart-of-darkness","The Heart of Darkness",5,"Allows a vampire to remove their own heart and store it outside of their body."],["protean.master-of-forms","Master of Forms",5,"Allows the vampire to take on any animal shape, rather than just one."],["protean.mist","Mist Form",5,"Turn into a cloud of mist."],["protean.one-with-the-land","One with the Land",5,"Sink into the earth of their Domain."],["protean.swarm","Swarm",5,"Allows the user to shapechange into a swarm of insects, reptiles, or other vermin"],["protean.the-unfettered-heart","The Unfettered Heart",5,"The heart of the vampire can move freely within the chest, making staking more difficult."],["protean.face-of-the-victim","Face of the Victim",5,"Assume the shape of someone they last fed from"]]}
